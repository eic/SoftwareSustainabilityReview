[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "software-sustainability-review"
version = "0.3.0"
description = "Collect metrics, validate assessments, and publish the EIC Software Sustainability Review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Metrics collection shells out to `git` and `gh`; no GitHub client library is needed.
dependencies = [
  "pyyaml>=6",
  "jinja2>=3.1",
  "jsonschema>=4.18",
  "markdown-it-py>=3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ssr = "ssr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ssr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
