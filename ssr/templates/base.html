<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<link rel="stylesheet" href="{{ root }}style.css">
<script>
  try { const t = localStorage.getItem("ssr-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="{{ root }}index.html">{{ site.title }}</a>
    <nav>
      <a href="{{ root }}index.html" {% if page == 'index.html' %}aria-current="page"{% endif %}>Overview</a>
      <a href="{{ root }}rubrics.html" {% if page == 'rubrics.html' %}aria-current="page"{% endif %}>Rubrics</a>
      <a href="{{ root }}passes.html" {% if page.startswith('passes') %}aria-current="page"{% endif %}>Passes</a>
      <a href="https://github.com/{{ site.repo }}">GitHub</a>
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode">◐</button>
    </nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="wrap site-footer">
  Assessments are generated by AI agents following human-owned
  <a href="{{ root }}rubrics.html">rubrics</a>, from public evidence only, and reviewed through pull requests to
  <a href="https://github.com/{{ site.repo }}">{{ site.repo }}</a>.
  Levels: 0 Absent · 1 Initial · 2 Established · 3 Sustained.
</footer>
<div id="tooltip" role="tooltip" hidden></div>
<script src="{{ root }}app.js"></script>
</body>
</html>
