schema_version: 1
project: algorithms
pass: "2026-10-12"
commit: 77a1ddb499c71d137e6f40a42366f5f16e7ff16d
assessor: { agent: claude-code, model: claude-opus-5-5 }
summary: >-
  One author wrote all non-bot commits in 24 months, there are no tests, and the README has no
  build or usage instructions, no contribution guide, no code of conduct, and no citation metadata.
  The library ships in eic-shell at its latest release (2.0.0), is required by EICrecon through an
  exported CMake package config, and is built with GCC and Clang in eic-shell on every PR and
  nightly, with those builds required by a ruleset.
criteria:
  eng.change-control:
    level: 2
    confidence: medium
    rationale: >-
      9 of 10 first-parent commits came from PRs and 5 of 8 PRs merged in 12 months (6 bot-authored)
      were approved by a person other than the author; the metric counts only the one non-bot PR
      (#25), which was self-merged without review. The ruleset requiring one approval is bypassed by
      admins (#25, #28, #30 merged unapproved; b54ac87 pushed directly), and there is no CODEOWNERS.
    evidence:
      - metrics:git.first_parent_pr_fraction_12m = 0.9
      - metrics:prs.reviewed_fraction_12m = 0.0
      - metrics:repo.rulesets = 2
      - https://github.com/eic/algorithms/pull/27
      - https://github.com/eic/algorithms/pull/32
      - https://github.com/eic/algorithms/pull/25
      - https://github.com/eic/algorithms/commit/b54ac874b46645e4795e3dbfe559423534683280
      - https://github.com/eic/.github/blob/3231e4d33f430f9806db8703b2feaafca084e18e/.github/pull_request_template.md
    gaps:
      - Fewer than 90% of merged PRs are reviewed by someone other than the author; admins bypass the required-approval ruleset.
      - No CODEOWNERS file.
    actions:
      - action: Remove the admin bypass from the "Default" ruleset so every PR, including maintainer and Dependabot PRs, needs one approval.
        priority: medium
        effort: S
      - action: Add `.github/CODEOWNERS` naming at least two reviewers for `core/` and `cmake/`.
        priority: medium
        effort: S
  eng.ci:
    level: 1
    confidence: high
    rationale: >-
      The GitHub workflow builds and installs in eic-shell for GCC and Clang on every PR, push, and
      nightly, and these builds are required status checks, but it runs no tests because none exist.
    evidence:
      - https://github.com/eic/algorithms/blob/77a1ddb499c71d137e6f40a42366f5f16e7ff16d/.github/workflows/linux-eic-shell.yml#L3-L13
