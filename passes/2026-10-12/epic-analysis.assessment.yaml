    evidence:
      - https://github.com/eic/epic-analysis/blob/4cd611b5bbb868ba5a05c4f217b6fd77834a3266/Makefile#L13-L15
      - metrics:files.clang_format = []
      - metrics:files.pre_commit = []
    gaps:
      - No formatter or linter configuration and no compiler warning flags.
    actions:
      - action: Add `.clang-format` and `.pre-commit-config.yaml` with clang-format, enable pre-commit.ci, and add `-Wall -Wextra` to `FLAGS` in the Makefile.
