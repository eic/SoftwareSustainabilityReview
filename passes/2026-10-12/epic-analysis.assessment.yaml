      - https://github.com/eic/epic-analysis/blob/4cd611b5bbb868ba5a05c4f217b6fd77834a3266/.github/workflows/ci.yml#L229-L289
      - https://github.com/eic/epic-analysis/issues/291
    gaps:
      - No unit tests for `Kinematics` reconstruction methods, `Weights`, or `Histos`.
      - CI produces plots but compares nothing against reference values, and its smoke tests are not running.
    actions:
      - action: Add a test executable (Catch2, available in eic-shell) that checks `Kinematics::CalculateDIS` for each method on fixed four-vectors, run from `ci.yml`.
        priority: medium
        effort: M
