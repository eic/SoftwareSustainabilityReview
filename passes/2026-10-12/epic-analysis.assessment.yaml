schema_version: 1
project: epic-analysis
pass: "2026-10-12"
commit: 4cd611b5bbb868ba5a05c4f217b6fd77834a3266
assessor: { agent: claude-code, model: claude-opus-5-5 }
summary: >-
  The project shows no commits in 12 months (metrics:git.commits_12m = 0), every recorded
  default-branch and PR CI run fails at the build step in the eic image, all 22 open issues are
  older than one year, and there are no unit tests, formatter, linter, citation metadata, or code of conduct.
  Changes reach `main` through branch-protected PRs with a required approval, the README and
  tutorials document an eic-shell workflow, and CI runs a full download-analysis-postprocess chain on
  sample fast- and full-simulation data.
criteria:
  eng.change-control:
    level: 2
    confidence: low
    rationale: >-
      The only first-parent change in 12 months came through PR #294 with an approving review, and
      branch protection requires one approval; level 3 is not met because protection does not apply
      to administrators and was bypassed for a direct push in April 2025 and a merge with a failing required check.
    evidence:
      - metrics:git.first_parent_pr_fraction_12m = 1.0
      - metrics:repo.default_branch_protected = true
      - https://github.com/eic/epic-analysis/pull/294
      - https://github.com/eic/epic-analysis/commit/8840aca
      - https://github.com/eic/.github/blob/3231e4d33f430f9806db8703b2feaafca084e18e/.github/pull_request_template.md
    gaps:
      - Branch protection has `enforce_admins` disabled; commit 8840aca (2025-04-27) was pushed directly to `main`.
      - PR #294 was merged while the required `collect` check was failing.
      - No `CODEOWNERS`; the 12-month sample is a single PR.
    actions:
      - action: Enable "Do not allow bypassing the above settings" (enforce for administrators) on the `main` protection rule.
        priority: medium
        effort: S
      - action: Add `.github/CODEOWNERS` naming at least two reviewers for `src/`, `macro/ci/`, and `.github/`.
        priority: medium
        effort: S
  eng.ci:
    level: 1
    confidence: high
    rationale: >-
      `ci.yml` runs on every PR and push to `main` and executes analysis and postprocessing macros on
      sample data, but every recorded default-branch run fails at the build jobs.
    evidence:
      - https://github.com/eic/epic-analysis/blob/4cd611b5bbb868ba5a05c4f217b6fd77834a3266/.github/workflows/ci.yml#L6-L10
      - https://github.com/eic/epic-analysis/blob/4cd611b5bbb868ba5a05c4f217b6fd77834a3266/.github/workflows/ci.yml#L178-L222
      - metrics:ci.default_branch_success_rate = 0.0
      - https://github.com/eic/epic-analysis/actions/runs/21193851680
    gaps:
      - Fewer than 80% of default-branch runs succeed; `build_all` and `build_no_delphes` fail on `main` and on open PRs.
    actions:
      - action: Fix the build failures in `build_all` and `build_no_delphes` (merge or rework PR #295 and replace `-L/usr/local/lib` per issue #292) so `main` CI passes.
        priority: high
        effort: M
  eng.testing:
    level: 1
    confidence: high
    rationale: >-
      There are no unit tests; CI runs analysis and postprocess macros on downloaded sample files as
      smoke tests, which currently do not execute because the build jobs fail.
    evidence:
