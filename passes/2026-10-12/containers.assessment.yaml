schema_version: 1
project: containers
pass: "2026-10-12"
commit: a5bead855571a4df268ee89cd4030c58c14ce795
assessor: { agent: claude-code, model: claude-opus-5-5 }
summary: >-
  The repository has no license file or citation metadata, no named maintainers or governance
  document, one author wrote 69.7% of commits in 24 months, and the documented quick start pulls an
  image tag (`latest`) that does not exist. Every PR and the default branch build all image flavors
  for amd64 and arm64 under a ruleset that requires one approval and the eicweb pipeline, which runs
  npsim/EICrecon end-to-end jobs and the detector and physics benchmarks on both default and nightly
  images (96% of default-branch runs succeed). Tagged CalVer images are published every month and are
  the eic-shell environment used across EIC CI and production.
criteria:
  eng.change-control:
    level: 2
    confidence: medium
    rationale: >-
      89.6% of first-parent commits in 12 months came from PRs and 93.3% of merged PRs were reviewed,
      under an active ruleset requiring one approval, with the eic organization PR template applying;
      about 37 commits were pushed directly through the ruleset's always-bypass team, so not nearly all changes arrive through PRs.
    evidence:
      - metrics:git.first_parent_pr_fraction_12m = 0.896
      - metrics:prs.reviewed_fraction_12m = 0.933
      - metrics:repo.rulesets = 2
      - https://github.com/eic/.github/blob/3231e4d33f430f9806db8703b2feaafca084e18e/.github/pull_request_template.md
    gaps:
      - "The \"Default\" ruleset gives one team always-bypass, and about 10% of default-branch commits in 12 months bypassed PRs."
      - No CODEOWNERS file.
    actions:
      - action: Change the bypass team in the "Default" ruleset to `pull_request` bypass mode so that all changes go through PRs.
        priority: medium
        effort: S
      - action: Add `.github/CODEOWNERS` naming at least two owners for `spack-environment/`, `containers/` and `.github/workflows/`.
        priority: medium
        effort: S
  eng.ci:
    level: 3
    confidence: medium
    rationale: >-
      `build-push.yml` builds the base, eic_ci and eic_xl images for amd64, amd64_v3 and arm64 on every PR and push and runs npsim/EICrecon jobs in the built image,
      the eicweb pipeline builds every other flavor (cuda, tf, dbg, jl, prod, cvmfs) and triggers the detector and physics benchmarks,
      and the ruleset requires the eicweb status and the four manifest jobs; 96% of default-branch runs succeeded.
    evidence:
      - https://github.com/eic/containers/blob/a5bead855571a4df268ee89cd4030c58c14ce795/.github/workflows/build-push.yml#L3-L19
      - https://github.com/eic/containers/blob/a5bead855571a4df268ee89cd4030c58c14ce795/.github/workflows/build-push.yml#L440-L474
      - https://github.com/eic/containers/blob/a5bead855571a4df268ee89cd4030c58c14ce795/.gitlab-ci.yml#L382-L438
