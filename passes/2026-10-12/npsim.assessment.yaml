      - https://github.com/eic/npsim/blob/ca28828f22e9fbeefc42636ed08dd35f084246d2/.github/workflows/linux-eic-shell.yml#L59-L75
      - https://github.com/eic/npsim/blob/ca28828f22e9fbeefc42636ed08dd35f084246d2/src/geocad/CMakeLists.txt#L37-L41
    gaps:
      - clang-format is not checked in CI or pre-commit.
      - CI compiles in Release, where `-Werror` is not set; the latest main build emits compiler warnings.
    actions:
      - action: Add `.pre-commit-config.yaml` with clang-format (and ruff for `src/python`) and enable pre-commit.ci, or add a `clang-format --dry-run --Werror` CI job.
        priority: medium
        effort: S
      - action: Add a `RelWithDebInfo` entry to the CI build matrix so `-Wall -Wextra -Werror -pedantic` applies in CI.
        priority: medium
        effort: S
  eng.modularity:
    level: 1
    confidence: medium
    rationale: >-
      CMake builds separate plugin, geocad, tool and Python components with C++20 and exports
      `NPDetTargets`, but `npsim.py` hard-codes detector-specific settings (filters, actions, a DIRC
      quantum-efficiency table) after option parsing, so steering files cannot override them.
    evidence:
      - https://github.com/eic/npsim/blob/ca28828f22e9fbeefc42636ed08dd35f084246d2/CMakeLists.txt#L8-L14
      - https://github.com/eic/npsim/blob/ca28828f22e9fbeefc42636ed08dd35f084246d2/CMakeLists.txt#L233-L258
      - https://github.com/eic/npsim/blob/ca28828f22e9fbeefc42636ed08dd35f084246d2/src/python/npsim.py#L29-L29
      - https://github.com/eic/npsim/blob/ca28828f22e9fbeefc42636ed08dd35f084246d2/src/python/npsim.py#L82-L151
      - https://github.com/eic/npsim/issues/55
    gaps:
      - Detector configuration (RICH/DIRC filters, actions, QE curve) is compiled into `npsim.py` and overrides user steering.
      - "`write_basic_package_version_file` uses the undefined `NPDet_VERSION`, and `project()` declares 1.0.0 at release v1.9.0."
    actions:
      - action: Move the DIRC QE table to the epic geometry (issue #55) and apply npsim defaults before `RUNNER.parseOptions()` so steering files and CLI options override them.
        priority: medium
        effort: M
      - action: Set `project(npsim VERSION ...)` to the release version and use `${PROJECT_VERSION}` in `write_basic_package_version_file`.
        priority: low
        effort: S
