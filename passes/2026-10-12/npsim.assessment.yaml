schema_version: 1
project: npsim
pass: "2026-10-12"
commit: ca28828f22e9fbeefc42636ed08dd35f084246d2
assessor: { agent: claude-code, model: claude-opus-5-5 }
summary: >-
  The repository has no license (issue #1 open since 2022), no citation metadata, a 13-line README
  without install or usage instructions, and one author wrote 73% of commits in 24 months while the
  eic-spack recipe names a single maintainer. 97.5% of default-branch changes arrive through PRs
  under a ruleset requiring approval, and CI builds with GCC and Clang (ASan/UBSan) in eic-shell,
  runs ctest, and runs end-to-end ePIC simulations compared against the previous main output with
  capybara. npsim ships in eic-shell, its eic-spack recipe is updated on each release day, and it
  is the simulation step of ePIC production campaigns and of epic and EICrecon CI.
criteria:
  eng.change-control:
    level: 2
    confidence: high
    rationale: >-
      97.5% of first-parent commits in 12 months came from PRs and an active ruleset requires one
      approving review and a status check, but only 80% of merged PRs were reviewed, and
      administrators bypass the ruleset (PRs #84, #90, #92 merged without an approval).
    evidence:
      - metrics:git.first_parent_pr_fraction_12m = 0.975
      - metrics:prs.reviewed_fraction_12m = 0.8
      - metrics:repo.rulesets = 2
      - metrics:repo.default_branch_protected = true
      - https://github.com/eic/npsim/pull/90
      - https://github.com/eic/.github/blob/3231e4d33f430f9806db8703b2feaafca084e18e/.github/pull_request_template.md
    gaps:
      - Fewer than 90% of merged PRs are reviewed by someone other than the author.
      - Ruleset bypass is set to "always" for organization admins, the admin role and one team.
      - No CODEOWNERS file.
    actions:
      - action: Remove the "always" bypass actors from the "Default" ruleset (or set them to pull-request-only) so every PR needs an approval.
        priority: medium
        effort: S
      - action: Add `.github/CODEOWNERS` naming at least two reviewers for `src/plugins/`, `src/python/`, `src/geocad/` and `src/tools/`.
        priority: medium
        effort: S
  eng.ci:
    level: 2
    confidence: high
    rationale: >-
      `linux-eic-shell.yml` runs on every PR and push to `main`, builds with g++ and clang++, runs
      ctest, and runs npsim end-to-end on gun and DIS samples, but 86.8% of default-branch runs
      succeeded, and the only required check (`build-artifacts-page`) is skipped, which GitHub
      reports as success, when upstream jobs fail.
    evidence:
      - https://github.com/eic/npsim/blob/ca28828f22e9fbeefc42636ed08dd35f084246d2/.github/workflows/linux-eic-shell.yml#L3-L11
      - https://github.com/eic/npsim/blob/ca28828f22e9fbeefc42636ed08dd35f084246d2/.github/workflows/linux-eic-shell.yml#L54-L78
      - https://github.com/eic/npsim/blob/ca28828f22e9fbeefc42636ed08dd35f084246d2/.github/workflows/linux-eic-shell.yml#L351-L359
      - metrics:ci.default_branch_success_rate = 0.868
      - https://github.com/eic/npsim/actions/runs/37413334041
    gaps:
      - Default-branch success rate is below 90%.
      - The required check `build-artifacts-page` is skipped (counted as passing) when build or simulation jobs fail, and the convert-to-step/dot jobs are not upstream of it.
    actions:
      - action: "Add an aggregating job with `if: always()` that fails when any of `build`, `npsim-gun`, `npsim-dis`, `convert-to-step` or `convert-to-dot` failed, and make it the required status check."
        priority: medium
        effort: S
  eng.testing:
    level: 1
    confidence: high
    rationale: >-
      ctest runs five tests in CI, covering one helper in `src/tools` and the geocad STEP exporter,
      and CI runs npsim end-to-end with a capybara comparison to the previous main output; none of
      the six DDG4 plugins or the `npsim.py` front-end has a unit test.
    evidence:
      - https://github.com/eic/npsim/blob/ca28828f22e9fbeefc42636ed08dd35f084246d2/src/tools/tests/unit_settings.cxx#L6-L18
      - https://github.com/eic/npsim/blob/ca28828f22e9fbeefc42636ed08dd35f084246d2/src/geocad/tests/CMakeLists.txt#L1-L22
      - https://github.com/eic/npsim/blob/ca28828f22e9fbeefc42636ed08dd35f084246d2/.github/workflows/linux-eic-shell.yml#L129-L150
      - metrics:code.test_files = 3
      - metrics:prs.test_touching_fraction_12m = 0.0
      - metrics:files.codecov = []
    gaps:
      - No unit tests for `EICInteractionVertexBoost`, `EICInteractionVertexSmear`, `Geant4TVEicParticleHandler`, `OpticalPhotonEfficiencyStackingAction` or the VolumeDispatch plugins.
      - The capybara comparison produces reports but does not fail CI on output differences.
      - No coverage measurement.
    actions:
      - action: Add ctest tests that run each DDG4 plugin through a minimal `ddsim`/`npsim` steering on a small test geometry and assert its effect (vertex shift, kept particles, photon suppression).
        priority: medium
        effort: M
  eng.static-quality:
    level: 1
    confidence: high
    rationale: >-
      `.clang-format` exists but is not enforced, CodeQL default setup (extended suite) runs on PRs,
      and ASan/UBSan builds run in CI; `-Wall -Wextra -Werror -pedantic` applies only to non-Release
      builds while CI builds only Release.
    evidence:
      - metrics:files.clang_format = [".clang-format"]
      - metrics:files.pre_commit = []
