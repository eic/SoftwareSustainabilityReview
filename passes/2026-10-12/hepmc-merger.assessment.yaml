schema_version: 1
project: hepmc-merger
pass: "2026-10-12"
commit: a86fdd66ffd5facfa0bfebc87b70377a2fe47e23
assessor: { agent: claude-code, model: claude-opus-5-5 }
summary: >-
  The repository has no license (issue #10 open since 2024), no citation metadata, no unit tests
  or static analysis, one author wrote 50% of commits in 24 months, and the README usage example
  uses command-line options removed in v2.0.0. All default-branch changes in 12 months arrived
  through reviewed PRs under a ruleset that requires an approval and the eic-shell CI checks, and
  each release (8 in 24 months) is packaged in eic-spack the same day and shipped in eic-shell,
  where ePIC production workflows run it.
criteria:
  eng.change-control:
    level: 3
    confidence: high
    rationale: >-
      All first-parent commits on `main` in 12 months came from PRs and every merged PR was
      reviewed by someone other than the author; an active ruleset requires one approving review,
      resolved threads and the `build`/`smoke-test` checks, and the eic organization PR template applies.
    evidence:
      - metrics:git.first_parent_pr_fraction_12m = 1.0
      - metrics:prs.reviewed_fraction_12m = 1.0
      - metrics:repo.rulesets = 1
      - https://github.com/eic/.github/blob/3231e4d33f430f9806db8703b2feaafca084e18e/.github/pull_request_template.md
      - https://github.com/eic/HEPMC_Merger/pull/31
    gaps: []
    actions: []
  eng.ci:
    level: 1
    confidence: medium
    rationale: >-
      `linux-eic-shell.yml` builds in eic-shell on every PR and push to `main` (3 of 3 default-branch
      runs succeeded) and is a required check, but it runs no test suite; the only check is one
      smoke run whose result is verified by `ls -la` on the output file.
    evidence:
      - https://github.com/eic/HEPMC_Merger/blob/a86fdd66ffd5facfa0bfebc87b70377a2fe47e23/.github/workflows/linux-eic-shell.yml#L3-L9
      - https://github.com/eic/HEPMC_Merger/blob/a86fdd66ffd5facfa0bfebc87b70377a2fe47e23/.github/workflows/linux-eic-shell.yml#L36-L66
      - metrics:ci.default_branch_success_rate = 1.0
      - metrics:ci.default_branch_runs = 3
    gaps:
      - No test suite (ctest) runs in CI; the smoke run checks only that the output file exists.
      - The `actions/checkout` step fetches no tags, so CI builds report version `0.0.0-unknown` (CMake warning in run 37384280511).
    actions:
      - action: Register tests with `enable_testing()`/`add_test` in `CMakeLists.txt` and run `ctest --test-dir build` in the `build` job.
        priority: medium
        effort: S
      - action: 'Set `fetch-depth: 0` on `actions/checkout` in `.github/workflows/linux-eic-shell.yml` so the built version matches the tag.'
        priority: low
        effort: S
  eng.testing:
    level: 1
    confidence: high
    rationale: >-
      There are no test files or test framework; the only automated test is a CI smoke run of one
      campaign configuration that checks the output file exists.
    evidence:
      - metrics:code.test_files = 0
      - metrics:prs.test_touching_fraction_12m = 0.0
      - https://github.com/eic/HEPMC_Merger/blob/a86fdd66ffd5facfa0bfebc87b70377a2fe47e23/.github/workflows/linux-eic-shell.yml#L50-L66
    gaps:
      - No unit tests for Poisson time placement, weighted sampling, background cycling or status shifting.
      - No check of output content (event counts, vertex times, run attributes).
    actions:
      - action: Add Catch2 tests under `tests/` for `poissonTimes`, `parse_backgrounds` and skip wrapping using the small `.hepmc` files in `python/`, registered with `add_test`.
        priority: medium
        effort: M
      - action: Add a CI step that runs the merger on local test files with a fixed `--rngSeed` and asserts placed event counts and GenRunInfo attributes with pyhepmc or uproot.
        priority: medium
        effort: S
  eng.static-quality:
    level: 0
    confidence: high
    rationale: >-
      No formatter, linter, pre-commit or static-analysis configuration exists, and `CMakeLists.txt`
      sets no warning flags.
    evidence:
      - metrics:files.clang_format = []
      - metrics:files.pre_commit = []
      - https://github.com/eic/HEPMC_Merger/blob/a86fdd66ffd5facfa0bfebc87b70377a2fe47e23/CMakeLists.txt#L40-L50
    gaps:
      - No formatter or linter configured or enforced.
      - No compiler warning flags.
    actions:
      - action: Add `.clang-format` and `.pre-commit-config.yaml` with clang-format and enable pre-commit.ci.
        priority: high
        effort: S
      - action: Add `target_compile_options(SignalBackgroundMerger PRIVATE -Wall -Wextra)` in `CMakeLists.txt`.
        priority: high
        effort: S
  eng.modularity:
    level: 1
    confidence: medium
    rationale: >-
      CMake builds and installs one C++17 executable, but all logic (CLI parsing, I/O, sampling,
      metadata) sits in one 824-line class, and the default signal input is a server URL compiled
      into the source that had to be edited in PR #31 when the endpoint moved.
    evidence:
      - metrics:code.cxx_standard = ["17"]
      - https://github.com/eic/HEPMC_Merger/blob/a86fdd66ffd5facfa0bfebc87b70377a2fe47e23/SignalBackgroundMerger.cpp#L63-L111
      - https://github.com/eic/HEPMC_Merger/blob/a86fdd66ffd5facfa0bfebc87b70377a2fe47e23/SignalBackgroundMerger.cpp#L283-L285
      - https://github.com/eic/HEPMC_Merger/pull/31
      - https://github.com/eic/HEPMC_Merger/issues/11
    gaps:
      - Single-file monolithic class with public data members; no separation into components.
      - Default input file URL hard-coded in source.
      - Three legacy Python merger scripts and a notebook remain alongside the C++ code.
    actions:
      - action: Split `SignalBackgroundMerger.cpp` into a library (`include/`, `src/`) for slice building and readers, plus a thin `main`.
        priority: medium
        effort: M
      - action: Remove the default `--signalFile` URL (require the option) and move or delete the legacy scripts in `python/`.
        priority: medium
        effort: S
  doc.user:
    level: 1
    confidence: high
    rationale: >-
      The README gives build steps and a `--help` pointer, but lists ROOT and HepMC without versions,
      does not mention eic-shell, and its usage example uses `--bg1File`/`--bg1Freq` options that the
      current CLI (since v2.0.0) rejects.
    evidence:
      - https://github.com/eic/HEPMC_Merger/blob/a86fdd66ffd5facfa0bfebc87b70377a2fe47e23/README.md#L4-L13
      - https://github.com/eic/HEPMC_Merger/blob/a86fdd66ffd5facfa0bfebc87b70377a2fe47e23/README.md#L28-L38
      - https://github.com/eic/HEPMC_Merger/blob/a86fdd66ffd5facfa0bfebc87b70377a2fe47e23/SignalBackgroundMerger.cpp#L302-L305
    gaps:
      - README usage example and default-behaviour text are outdated and not runnable.
      - Dependency versions and the eic-shell route are not documented.
      - The `--bgFile` tuple and status-shift options are documented only in `--help`.
    actions:
      - action: Replace the README example with the `--bgFile <file> <freq> [skip] [status]` form from the CI smoke test and add an "Installation" section covering eic-shell and HepMC3 >= 3.2.6, ROOT >= 6.20.
        priority: medium
        effort: S
  doc.developer:
    level: 1
    confidence: high
    rationale: >-
      A few methods carry comments and the README "Logic" section describes the sampling in one
      paragraph, but there is no generated API reference and no architecture overview.
    evidence:
      - https://github.com/eic/HEPMC_Merger/blob/a86fdd66ffd5facfa0bfebc87b70377a2fe47e23/SignalBackgroundMerger.cpp#L494-L511
      - https://github.com/eic/HEPMC_Merger/blob/a86fdd66ffd5facfa0bfebc87b70377a2fe47e23/README.md#L44-L52
      - metrics:files.doxygen = []
    gaps:
      - No generated API documentation.
      - No description of slice building, weighted sampling and the GenRunInfo attribute schema.
    actions:
      - action: Add `docs/design.md` describing the slice loop, weighted sampling, status shifting and the `hepmc_merger_*` run attributes, plus Doxygen comments on each method.
        priority: medium
        effort: S
  doc.contributing:
    level: 1
    confidence: high
    rationale: >-
      Only the eic organization PR and issue templates apply; there is no CONTRIBUTING file
      describing setup, building, testing or conventions.
    evidence:
      - metrics:community.files.contributing = false
      - https://github.com/eic/.github/blob/3231e4d33f430f9806db8703b2feaafca084e18e/.github/pull_request_template.md
      - https://github.com/eic/.github/tree/3231e4d33f430f9806db8703b2feaafca084e18e/.github/ISSUE_TEMPLATE
    gaps:
      - No CONTRIBUTING describing eic-shell setup, build, test and PR conventions.
    actions:
      - action: Add `CONTRIBUTING.md` covering building in eic-shell, running the smoke test, code style and the PR review rule.
        priority: medium
        effort: S
  com.responsiveness:
    level: 1
    confidence: low
    rationale: >-
      All 3 issues opened in 12 months got a same-day response, but 9 of 10 open issues are older
      than one year and no new issue is labeled.
    evidence:
      - metrics:issues.created_12m = 3
      - metrics:issues.median_first_response_days_12m = 0.0
      - metrics:issues.open_older_365d = 9
      - metrics:issues.labeled_fraction_12m = 0.0
      - https://github.com/eic/HEPMC_Merger/issues/5
    gaps:
      - More than half of open issues are older than one year (#1, #3–#7, #10, #11, #14).
      - No issue labeling or triage.
    actions:
      - action: Close issues resolved by later PRs (#5 by the C++ rewrite with ROOT I/O, #14 by #15) and label the remaining open issues.
        priority: medium
        effort: S
  com.contributors:
    level: 1
    confidence: medium
    rationale: >-
      Five authors committed in 24 months, but all commits map to one institutional e-mail domain,
      no new authors joined in 12 months, and no merged PR came from outside the maintainer group.
    evidence:
      - metrics:git.authors_24m = 5
      - metrics:git.email_domains_24m = 1
      - metrics:git.new_authors_12m = 0
      - metrics:prs.external_fraction_12m = 0.0
    gaps:
