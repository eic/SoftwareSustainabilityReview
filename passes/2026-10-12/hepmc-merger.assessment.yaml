    actions:
      - action: Add a README section stating the owning ePIC group, how decisions are made, and the planned status relative to TimeframeBuilder.
        priority: medium
        effort: S
  com.conduct:
    level: 1
    confidence: high
    rationale: >-
      The eic organization issue-template configuration links the ePIC Mattermost and meeting
      series, but no code of conduct applies to the repository or organization.
    evidence:
