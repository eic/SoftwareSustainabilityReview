    actions:
      - action: Add `hepmc_merger_rng_seed`, `hepmc_merger_squash_time` and status-shift attributes to the GenRunInfo in `merge()`.
        priority: medium
        effort: S
      - action: Document in the README the eic-shell release that ships each merger release.
        priority: medium
        effort: S
