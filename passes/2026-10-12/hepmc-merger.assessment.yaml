    actions:
      - action: Link the ePIC collaboration code of conduct with its reporting contact from the README (or add `CODE_OF_CONDUCT.md` in `eic/.github`).
        priority: high
        effort: S
  dist.packaging:
    level: 3
    confidence: high
    rationale: >-
      The eic-spack `hepmcmerger` recipe provides the latest release 2.4.0, which eic-shell ships,
      and the recipe gained v2.2.0, v2.3.0 and v2.4.0 on their release days.
    evidence:
      - metrics:packaging.eic_spack.versions = ["main", "2.4.0", "2.3.0", "2.2.0", "2.1.0"]
      - metrics:packaging.eic_shell_version = 2.4.0
      - metrics:packaging.latest_release_packaged = true
      - https://github.com/eic/eic-spack/commit/5476d222efd992e87e6906fa92b78df3cb2aacec
    gaps: []
    actions: []
  dist.releases:
    level: 1
    confidence: high
    rationale: >-
      Eight releases with generated notes appeared in 24 months, but no version scheme is
      documented and v2.0.0, which replaced the `--bgNFile` options, carries no migration note.
    evidence:
      - metrics:releases.count_24m = 8
      - metrics:releases.with_notes_fraction_24m = 1.0
