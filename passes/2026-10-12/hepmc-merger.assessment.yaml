      but the random seed and status shifts are not recorded, and no environment (eic-shell version)
      is documented in the repository.
    evidence:
      - https://github.com/eic/HEPMC_Merger/blob/a86fdd66ffd5facfa0bfebc87b70377a2fe47e23/SignalBackgroundMerger.cpp#L172-L213
