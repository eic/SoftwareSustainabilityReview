      - metrics:releases.authors_24m = 2
      - https://github.com/eic/HEPMC_Merger/blob/a86fdd66ffd5facfa0bfebc87b70377a2fe47e23/README.md#L2-L3
    gaps:
      - Bus factor (50%) is 1.
      - No CODEOWNERS or maintainer list naming at least two current maintainers.
    actions:
      - action: Add `.github/CODEOWNERS` naming at least two current maintainers and list them in the README.
        priority: high
        effort: S
  com.governance:
    level: 1
    confidence: high
    rationale: >-
      The README names the C++ maintainer and decisions are discussed in public issues, but there is
      no documented decision process or maintainer path, and the stated plan to retire the merger in
      favour of TimeframeBuilder is recorded only in an issue comment.
    evidence:
      - https://github.com/eic/HEPMC_Merger/blob/a86fdd66ffd5facfa0bfebc87b70377a2fe47e23/README.md#L2-L3
      - https://github.com/eic/HEPMC_Merger/issues/29
    gaps:
