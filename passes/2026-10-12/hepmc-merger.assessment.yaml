        effort: S
  dist.dependencies:
    level: 1
    confidence: high
    rationale: >-
      HepMC3 (>= 3.2.6) and ROOT (>= 6.20) have minimum versions, but argparse is vendored without
      a version and unchanged since 2024 (eic-shell ships CLI11), `python/requirements.txt` has no
      versions, and there is no update monitoring.
    evidence:
      - https://github.com/eic/HEPMC_Merger/blob/a86fdd66ffd5facfa0bfebc87b70377a2fe47e23/CMakeLists.txt#L25-L32
