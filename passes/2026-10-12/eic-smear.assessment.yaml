    actions:
      - action: Set `target_compile_features(eicsmear PUBLIC cxx_std_17)` (or higher) on all targets in `CMakeLists.txt`.
        priority: medium
        effort: S
      - action: Port `eicpy/` to Python 3 or remove it, and delete the `.orig` and `.betterbutdifferent` files.
        priority: low
        effort: S
