schema_version: 1
project: eic-smear
pass: "2026-10-12"
commit: 9e00d758e9c87a067ceb6e902648a8b28783491c
assessor: { agent: claude-code, model: claude-opus-5-5 }
summary: >-
  One author wrote 83% of commits in 24 months (bus factor 1), there are no automated tests, 59% of
  default-branch commits in 12 months were pushed directly, and there is no code of conduct or
  citation metadata. The project is GPL-3.0 licensed, ships in eic-shell with eic-spack recipes
  updated on the day of each release, and CI builds every PR and push in the eic_xl nightly image.
criteria:
  eng.change-control:
    level: 1
    confidence: high
    rationale: >-
      Only 41% of first-parent commits in 12 months came from PRs; version bumps and code fixes are
      pushed directly, and the ruleset requires no approving review.
    evidence:
      - metrics:git.first_parent_pr_fraction_12m = 0.412
      - metrics:prs.reviewed_fraction_12m = 0.833
      - https://github.com/eic/eic-smear/commit/9e00d758e9c87a067ceb6e902648a8b28783491c
      - https://github.com/eic/eic-smear/commit/820d80614102ea1cb5433fe77507cbdfff57a9d2
      - https://github.com/eic/eic-smear/rules/10735385
    gaps:
      - Fewer than 80% of default-branch changes in 12 months arrived through PRs.
      - The `master` ruleset only blocks deletion and force-push and requests Copilot review; no human approval is required.
    actions:
      - action: Add a `pull_request` rule with one required approving review to ruleset 10735385 so code fixes and version bumps go through PRs.
        priority: medium
        effort: S
  eng.ci:
    level: 1
    confidence: high
    rationale: >-
      The single workflow builds and installs in the eic_xl nightly image on every PR and push to
      `master` (12 of 12 default-branch runs succeeded), but runs no tests.
    evidence:
      - https://github.com/eic/eic-smear/blob/9e00d758e9c87a067ceb6e902648a8b28783491c/.github/workflows/linux-eic-shell.yml#L3-L8
      - https://github.com/eic/eic-smear/blob/9e00d758e9c87a067ceb6e902648a8b28783491c/.github/workflows/linux-eic-shell.yml#L27-L33
      - metrics:ci.default_branch_success_rate = 1.0
    gaps:
      - CI runs no test suite or example; it only compiles and installs.
    actions:
      - action: Add a step to `.github/workflows/linux-eic-shell.yml` that runs `ctest` (once tests exist) and a `BuildTree`/`SmearTree`/`TreeToHepMC` run on a small committed input file.
        priority: medium
        effort: S
  eng.testing:
    level: 0
    confidence: high
    rationale: >-
      The repository contains no test files, no CTest registration and no test framework; no merged
      PR in 12 months touched tests.
    evidence:
      - metrics:code.test_files = 0
