      - https://github.com/eic/eic-smear/blob/9e00d758e9c87a067ceb6e902648a8b28783491c/CMakeLists.txt#L329-L344
    gaps:
      - No unit tests for the generator readers, `Smear::Detector`/`Smearer` classes or `TreeToHepMC`.
      - The README says example files are included for testing, but none are in the repository.
    actions:
      - action: Add `enable_testing()` and a CTest test that runs `BuildTree` on a small committed generator text file per supported format and checks the event count.
        priority: high
        effort: M
      - action: Add a test that converts a committed tree with `TreeToHepMC` and checks particle counts and cross-section units in the HepMC3 output.
        priority: high
        effort: S
  eng.static-quality:
