  eic.reuse:
    level: 1
    confidence: medium
    rationale: >-
      EICrecon builds on JANA2, algorithms, podio, EDM4eic, DD4hep and ACTS, but a 600-line helix
      propagation and pairing code derived from STAR (`Helix.cc`) runs secondary vertexing in parallel to
