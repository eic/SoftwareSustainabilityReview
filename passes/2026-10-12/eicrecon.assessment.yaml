    evidence:
      - metrics:eic.domain_components = [acts, afterburner, algorithms, dd4hep, edm4eic, edm4hep, epic, fastjet, irt, jana2, npsim, podio]
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/src/algorithms/reco/Helix.h#L1-L2
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/src/algorithms/tracking/SecondaryVertexFinder.h
    gaps:
      - Helix-based secondary vertexing reimplements track propagation and vertexing available in ACTS, with no documented reason.
    actions:
      - action: Document in `docs/design/tracking.md` why `SecondaryVerticesHelix` is kept alongside the ACTS vertexer, or replace it with ACTS propagation and vertex fitting.
