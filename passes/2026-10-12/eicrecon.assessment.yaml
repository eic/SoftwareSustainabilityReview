schema_version: 1
project: eicrecon
pass: '2026-10-12'
commit: b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8
assessor: { agent: claude-code, model: claude-opus-5-5 }
summary: >-
  The main risks are concentration of authorship (one author wrote 51.8% of commits in 24 months, no
  CODEOWNERS or maintainer list), a review rate just under 50% of merged PRs, and contradictory
  licensing (LGPL-3.0 file and headers versus a public-domain NOTICE.md, plus third-party code with an
  undetermined license). Established practices are a required-check, merge-queue CI in eic-shell
  (nightly and two stable releases) with sanitizer builds, full-chain simulation and reconstruction
  jobs, and capybara output comparisons, together with eic-spack packaging and inclusion in eic-shell
  at the latest release.
criteria:
  eng.change-control:
    level: 1
    confidence: high
    rationale: >-
      All first-parent commits arrive through PRs, but 49.2% of merged human PRs in 12 months had a
      review from someone other than the author, below the 50% needed for level 2.
    evidence:
      - metrics:git.first_parent_pr_fraction_12m = 1.0
      - metrics:prs.reviewed_fraction_12m = 0.492
      - metrics:repo.rulesets = 2
      - https://github.com/eic/EICrecon/rules/23476788
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/CONTRIBUTING.md#L54-L67
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/.github/pull_request_template.md#L1-L21
    gaps:
      - Fewer than 50% of merged PRs in 12 months were reviewed by a non-author; the ruleset requiring one approval exists only since 2026-09-15.
      - No CODEOWNERS file.
    actions:
      - action: Keep the `main` ruleset's one-approval requirement active so that at least 50% (then 90%) of merged PRs carry a non-author review in the next 12-month window.
        priority: high
        effort: S
  eng.ci:
    level: 3
    confidence: high
    rationale: >-
      `linux-eic-shell.yml` builds and runs ctest on every PR, merge-queue entry and push to main in
      eic-shell (GCC and Clang, nightly and two stable releases), required status checks gate the
      merge queue, full simulation-plus-reconstruction jobs and an eic_container trigger provide
      integration checks, and 92% of default-branch runs succeed.
    evidence:
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/.github/workflows/linux-eic-shell.yml#L1-L14
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/.github/workflows/linux-eic-shell.yml#L80-L127
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/.github/workflows/linux-eic-shell.yml#L229-L235
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/.github/workflows/linux-eic-shell.yml#L1194-L1260
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/.github/workflows/linux-eic-shell.yml#L1591-L1625
      - https://github.com/eic/EICrecon/rules/23476788
      - metrics:ci.default_branch_success_rate = 0.92
    gaps: []
    actions: []
  eng.testing:
    level: 1
    confidence: medium
    rationale: >-
      Catch2 unit tests exist for 22 of about 87 algorithm sources, and the per-library coverage
      posted by CI ranges from 2.9% (reco) to 66.7% (pid_lut), so unit tests cover a minority of
      algorithms; end-to-end reconstruction jobs and capybara comparisons against the base-branch
      output do run in CI.
    evidence:
      - metrics:code.test_files = 34
      - metrics:prs.test_touching_fraction_12m = 0.145
      - https://github.com/eic/EICrecon/tree/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/src/tests/algorithms_test
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/.github/workflows/linux-eic-shell.yml#L414-L472
      - https://github.com/eic/EICrecon/commit/62eb86ae835ea5db9bfa82a716d322e8093992bb
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/.github/workflows/linux-eic-shell.yml#L1001-L1016
    gaps:
      - Unit tests cover a minority of algorithms (coverage below 30% in 6 of 9 algorithm libraries, 2.9% in reco).
      - Only 14.5% of merged PRs touch test files.
      - "`tracking_test`, `track_propagation_test` and `geometry_navigation_test` are not added in `src/tests/CMakeLists.txt`."
    actions:
      - action: Add Catch2 tests in `src/tests/algorithms_test/` for the untested algorithms in `src/algorithms/reco` and `src/algorithms/tracking` until each algorithm library reports coverage above 50%.
        priority: medium
        effort: L
      - action: Add a PR-template checkbox and review rule requiring a unit test for every new or changed algorithm.
        priority: medium
        effort: S
  eng.static-quality:
    level: 2
    confidence: high
    rationale: >-
      clang-format, codespell and cmake-lint run through pre-commit.ci, clang-tidy and IWYU run on
      changed files in every PR, ASan/UBSan/TSan builds run in CI, and builds use `-Werror -Wall
      -Wextra`; clang-tidy findings are advisory and deprecation warnings are exempted from -Werror.
    evidence:
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/.pre-commit-config.yaml#L1-L29
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/.clang-tidy#L1-L25
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/.github/workflows/linux-eic-shell.yml#L98-L105
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/.github/workflows/linux-eic-shell.yml#L281-L412
    gaps:
      - "`.clang-tidy` sets no `WarningsAsErrors`, so clang-tidy findings neither fail CI nor are tracked to zero."
      - "`-Wno-error=deprecated-declarations` is applied repository-wide in the CI matrix."
    actions:
      - action: Set `WarningsAsErrors` in `.clang-tidy` for the enabled check groups, or publish the clang-tidy warning count on main and drive it to zero.
        priority: medium
        effort: M
      - action: Remove `-Wno-error=deprecated-declarations` from the CI matrix once the Acts deprecations are resolved.
        priority: low
        effort: M
  eng.modularity:
    level: 2
    confidence: medium
    rationale: >-
      Code is split into algorithms, factories, services and detector plugins built with CMake (C++20)
      and exported via `EICreconTargets` and `EICreconConfig.cmake`, with parameters exposed through
      JANA `-P` options; every header is installed with no public/internal split and there is no
      architecture overview.
    evidence:
      - metrics:code.cxx_standard = 20
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/CMakeLists.txt#L80-L91
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/CMakeLists.txt#L355-L378
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/cmake/jana_plugin.cmake#L59-L89
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/src/detectors/BEMC/BEMC.cc#L50-L80
    gaps:
      - All headers are installed (`cmake/jana_plugin.cmake` L168-L171); no public API is separated from internals.
      - No architecture overview of the plugin, factory and algorithm layers.
      - Detector calibration defaults are compiled into `src/detectors/*` plugins.
    actions:
      - action: Write `docs/design/architecture.md` describing the algorithms/factories/services/detectors layers and the data flow, and link it from `docs/_sidebar.md`.
        priority: medium
        effort: S
      - action: Install only headers of the algorithm interfaces and configs intended for downstream use, and mark the rest internal.
        priority: low
        effort: M
  doc.user:
    level: 1
    confidence: high
    rationale: >-
