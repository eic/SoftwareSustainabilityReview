      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/docs/get-started/manual-build.md#L65-L74
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/docs/get-started/manual-build.md#L207-L221
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/docs/tutorial/02-work-environment.md#L115-L147
      - https://github.com/eic/EICrecon/blob/b67b442e26a3bad8c9ca2ac7b58f8474eb3718f8/CMakeLists.txt#L59-L77
    gaps:
      - "`docs/get-started/manual-build.md` dependency versions do not match the minimums in `CMakeLists.txt` and omit algorithms, onnxruntime, FastJet and IRT2."
      - "`docs/howto/full_chain_simulation.md` still refers to athena.xml and Juggler."
    actions:
