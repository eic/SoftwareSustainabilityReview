schema_version: 1
project: irt
pass: '2026-10-12'
commit: 1479e6079cbe79f02afcbaba3b70be358c1962e7
assessor: { agent: claude-code, model: claude-opus-5-5 }
summary: >-
  The main risks are the absence of any automated tests, a README that declares itself obsolete and
  describes the retired ATHENA/jug_xl workflow, and missing contribution, governance, citation and
  version-scheme documentation. Established practices are PR-based changes (88.9%) with required GCC/Clang
  builds and clang-tidy checks in `eic_xl:nightly`, and an eic-spack `irt2` recipe that shipped release
  2.2.3 in eic-shell within a day, where EICrecon and the epic geometry use it for RICH particle identification.
criteria:
  eng.change-control:
    level: 1
    confidence: high
    rationale: >-
      88.9% of first-parent commits in 12 months came through PRs, but only 38.9% of merged PRs had a
      review by someone other than the author; branch protection requires status checks but no approving review.
    evidence:
      - metrics:git.first_parent_pr_fraction_12m = 0.889
      - metrics:prs.reviewed_fraction_12m = 0.389
      - metrics:repo.default_branch_protected = true
      - https://github.com/eic/irt/pull/62
      - https://github.com/eic/irt/pull/66
    gaps:
      - Fewer than 50% of merged PRs are reviewed by a non-author (e.g. #61, #62, #66 merged without review).
      - Branch protection on `main` requires no approving review and is not enforced for admins.
      - No CODEOWNERS file.
    actions:
      - action: Add `required_pull_request_reviews` with one approval to the `main` branch protection and enable `enforce_admins`.
        priority: medium
        effort: S
      - action: Add `.github/CODEOWNERS` naming at least two reviewers for `source/` and `include/`.
        priority: medium
        effort: S
  eng.ci:
    level: 1
    confidence: high
    rationale: >-
      `linux-eic-shell.yml` builds and installs with GCC and Clang on every PR and push and these jobs are
      required checks, but there are no tests to run and only 61.9% of recent default-branch runs succeeded.
    evidence:
      - https://github.com/eic/irt/blob/1479e6079cbe79f02afcbaba3b70be358c1962e7/.github/workflows/linux-eic-shell.yml#L3-L9
      - https://github.com/eic/irt/blob/1479e6079cbe79f02afcbaba3b70be358c1962e7/.github/workflows/linux-eic-shell.yml#L24-L38
      - metrics:ci.default_branch_success_rate = 0.619
      - https://github.com/eic/irt/actions/runs/22971027531
    gaps:
      - CI runs no tests; the build step is `cmake --build` and `cmake --install` only.
      - The clang-tidy job failed on every `main` push from 2026-01-25 to 2026-05-17 (8 consecutive runs).
      - No integration or downstream check (e.g. building EICrecon's RICH-IRT plugin against the new build).
    actions:
      - action: Add a `ctest --test-dir build --output-on-failure` step to the build job once tests exist (see eng.testing).
        priority: high
        effort: S
      - action: Add a job that builds EICrecon with `-DIRT2_ROOT` pointing at the installed artifact in `eic_xl:nightly`.
        priority: medium
        effort: M
  eng.testing:
    level: 0
    confidence: high
    rationale: >-
      The repository contains no test files, no test framework and no `enable_testing()`; issue #37
      ("Unit testing") has been open since 2023-06.
    evidence:
      - metrics:code.test_files = 0
      - metrics:prs.test_touching_fraction_12m = 0.0
      - https://github.com/eic/irt/issues/37
    gaps:
      - No unit tests for the surface intersection, ray-tracing or reconstruction algorithms.
      - No regression test against reference PID outputs.
    actions:
      - action: Add Catch2 unit tests (registered with `ctest`) for `SphericalSurface`, `FlatSurface` and the `IRT` ray-tracing solution.
        priority: high
        effort: M
      - action: Add an end-to-end test that runs `ReconstructionFactory` on a small stored event file and checks the PID result.
        priority: high
        effort: M
  eng.static-quality:
    level: 1
    confidence: high
    rationale: >-
      `.clang-tidy` is applied to changed files on every PR as a required check and the library builds with
      `-Wall` and has sanitizer options, but no formatter is configured (`FormatStyle: none`) and clang-tidy findings do not fail CI.
    evidence:
      - https://github.com/eic/irt/blob/1479e6079cbe79f02afcbaba3b70be358c1962e7/.clang-tidy#L1-L25
      - https://github.com/eic/irt/blob/1479e6079cbe79f02afcbaba3b70be358c1962e7/.github/workflows/linux-eic-shell.yml#L75-L102
      - https://github.com/eic/irt/blob/1479e6079cbe79f02afcbaba3b70be358c1962e7/CMakeLists.txt#L17-L21
      - https://github.com/eic/irt/blob/1479e6079cbe79f02afcbaba3b70be358c1962e7/CMakeLists.txt#L129
    gaps:
      - No `.clang-format` or other formatter, and no format check in CI or pre-commit.
      - The sanitizer options exist but no CI job enables them.
    actions:
      - action: Add `.clang-format` and a `.pre-commit-config.yaml` with the clang-format hook, and enable pre-commit.ci.
        priority: medium
        effort: S
  eng.modularity:
    level: 1
    confidence: medium
    rationale: >-
      CMake builds and installs `libIRT2` with an exported `IRT2Config.cmake`, but the standard is set by
      overwriting `CMAKE_CXX_FLAGS` with a C++11 fallback although the code uses C++17, and a process-wide
      `CherenkovDetectorCollection::m_Instance` singleton holds global state.
    evidence:
      - https://github.com/eic/irt/blob/1479e6079cbe79f02afcbaba3b70be358c1962e7/CMakeLists.txt#L40-L54
      - https://github.com/eic/irt/blob/1479e6079cbe79f02afcbaba3b70be358c1962e7/CMakeLists.txt#L178-L225
      - https://github.com/eic/irt/blob/1479e6079cbe79f02afcbaba3b70be358c1962e7/include/CherenkovDetectorCollection.h#L26-L29
      - https://github.com/eic/irt/blob/1479e6079cbe79f02afcbaba3b70be358c1962e7/evaluation/CMakeLists.txt#L29-L36
    gaps:
      - C++17 is not required (`CMAKE_CXX_STANDARD` unset; falls back to `-std=c++11`) and user `CMAKE_CXX_FLAGS` are discarded.
      - Global singleton state in `CherenkovDetectorCollection`.
      - The `EVALUATION` subproject links a non-existent `IRT` target and the retired `DD4pod` library, and the build adds `${CMAKE_INSTALL_PREFIX}/include` to include paths.
    actions:
      - action: Replace the flag logic in `CMakeLists.txt` with `set(CMAKE_CXX_STANDARD 17)` and `CMAKE_CXX_STANDARD_REQUIRED ON`.
        priority: medium
        effort: S
      - action: Remove or port `evaluation/` and drop `${CMAKE_INSTALL_PREFIX}/include` from `include_directories`.
        priority: medium
        effort: S
  doc.user:
    level: 1
    confidence: medium
    rationale: >-
      The README has CMake build and run commands, but it opens with "THIS README is OBSOLETE" and describes
      the retired ATHENA, eicd and `jug_xl` workflow; IRT2, its dependencies and the JSON configuration are not documented.
    evidence:
      - https://github.com/eic/irt/blob/1479e6079cbe79f02afcbaba3b70be358c1962e7/README.md#L1-L4
      - https://github.com/eic/irt/blob/1479e6079cbe79f02afcbaba3b70be358c1962e7/README.md#L67-L108
      - https://github.com/eic/irt/issues/21
    gaps:
      - No current installation instructions with dependency versions (ROOT 6, optional nlohmann_json 3.11.2) or an eic-shell route.
      - No runnable quick-start example for the IRT2 API; CMake options and the JSON configuration format are undocumented.
    actions:
      - action: Rewrite `README.md` for IRT2 with eic-shell and from-source builds, dependency versions, CMake options and a minimal usage example.
        priority: high
        effort: S
  doc.developer:
    level: 1
    confidence: medium
    rationale: >-
      Public headers carry scattered inline comments and the README introduction describes the
