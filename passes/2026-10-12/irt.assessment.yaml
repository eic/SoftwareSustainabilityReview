      - https://github.com/eic/irt/blob/1479e6079cbe79f02afcbaba3b70be358c1962e7/README.md#L40-L62
      - metrics:files.doxygen = []
    gaps:
      - Most public classes and methods (e.g. `ReconstructionFactory`, `CherenkovDetectorCollection`) have no API comments.
      - No generated API docs and no architecture document.
    actions:
      - action: Add a `Doxyfile` and `docs/architecture.md` describing the detector, radiator, surface and reconstruction classes and their data flow.
