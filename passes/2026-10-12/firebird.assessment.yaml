schema_version: 1
project: firebird
pass: "2026-10-12"
commit: ee65aa1055a78426ca042d4ed32fda653c3ae892
assessor: { agent: claude-code, model: claude-opus-5-5 }
summary: >-
  pyrobird ships in eic-shell and Firebird is linked as the EIC event display; CI runs the TypeScript and pytest suites, a Python 3.10-3.14 matrix and a server integration test on every PR, with 97% of default-branch runs succeeding.
  Knowledge is concentrated (bus factor 1, top author 72% of commits, 2 active authors in 12 months, no external PRs), and a 467-file PR (#137) was merged without human review.
  There are no git tags, GitHub releases or release notes, no formatter, no CONTRIBUTING, code of conduct or citation metadata, and the DD4hep plugin is neither built in CI nor tested in eic-shell.
criteria:
  eng.change-control:
    level: 2
    confidence: high
    rationale: >-
      90% of first-parent commits in 12 months came from PRs and 57% of merged PRs were reviewed by a non-author, but branch protection requires zero approvals and admins can bypass the ruleset.
    evidence:
      - metrics:git.first_parent_pr_fraction_12m = 0.9
      - metrics:prs.reviewed_fraction_12m = 0.571
      - https://github.com/eic/firebird/rules/10656024
      - https://github.com/eic/firebird/pull/137
    gaps:
      - Fewer than 90% of merged PRs are reviewed; PR 137 (467 files changed) was self-merged without a human review.
      - Branch protection sets `required_approving_review_count` to 0 and there is no CODEOWNERS file.
    actions:
      - action: Set `required_approving_review_count` to 1 on `main` and remove the always-bypass for the admin role in ruleset 10656024.
        priority: medium
        effort: S
      - action: Add `.github/CODEOWNERS` assigning `firebird-ng/`, `packages/`, `pyrobird/` and `dd4hep-plugin/` to at least two reviewers.
        priority: medium
        effort: S
  eng.ci:
    level: 2
    confidence: high
    rationale: >-
      Three workflows run the frontend suites, pytest on Python 3.10-3.14 and a build-plus-server integration test on every PR and push, with 97% default-branch success; the DD4hep plugin is not built and the required checks are stale.
    evidence:
      - https://github.com/eic/firebird/blob/ee65aa1055a78426ca042d4ed32fda653c3ae892/.github/workflows/frontend.yaml#L3-L86
      - https://github.com/eic/firebird/blob/ee65aa1055a78426ca042d4ed32fda653c3ae892/.github/workflows/pyrobird.yaml#L3-L43
      - https://github.com/eic/firebird/blob/ee65aa1055a78426ca042d4ed32fda653c3ae892/.github/workflows/integration-tests.yml#L3-L60
      - metrics:ci.default_branch_success_rate = 0.971
    gaps:
      - The `dd4hep-plugin/` CMake project is not built in any workflow.
      - Ruleset 10656024 requires `integration-tests (3.8)` and `(3.9)`, which no longer exist, and does not require `test-and-build` or `test (*)`.
    actions:
      - action: Update the required status checks in ruleset 10656024 to the current `test-and-build`, `test (3.x)` and `integration-tests (3.x)` job names.
        priority: medium
        effort: S
