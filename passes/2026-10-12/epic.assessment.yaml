    evidence:
      - metrics:git.bus_factor_50_24m = 2
      - metrics:git.top_author_share_24m = 0.286
      - metrics:prs.distinct_reviewers_12m = 17
      - metrics:prs.distinct_mergers_12m = 14
      - metrics:releases.authors_24m = 1
      - metrics:files.codeowners = []
    gaps:
      - No CODEOWNERS or maintainer list naming at least two people.
      - All releases in 24 months were made by one person and the release procedure is not documented.
    actions:
      - action: Add `.github/CODEOWNERS` assigning two owners per `src/`/`compact/` subsystem directory.
        priority: high
        effort: S
      - action: Document the monthly release and backport procedure in `RELEASING.md` and have a second maintainer publish a release.
        priority: high
        effort: S
  com.governance:
    level: 1
    confidence: medium
    rationale: >-
      Maintainers can be identified only from `LICENSE.spdx` originators and the eic-spack recipe, and
      decisions are visible in PRs and linked weekly meetings, but there is no documented decision
      process or maintainer path, and milestones stopped in 2025.
    evidence:
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/LICENSE.spdx#L1-L7
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.github/ISSUE_TEMPLATE/config.yml#L1-L11
      - https://github.com/eic/epic/milestones
    gaps:
      - No document states who decides, who the "core developers" in CONTRIBUTING.md are, or how to become one.
      - Milestones are stale (latest open milestone 25.08.0).
    actions:
      - action: Add `GOVERNANCE.md` naming the maintainers and core developers, the decision process, and the path to reviewer and maintainer.
        priority: medium
        effort: S
  com.conduct:
    level: 1
    confidence: high
    rationale: >-
      The issue-template configuration links the EIC Mattermost and weekly Indico meetings for support,
      but no code of conduct applies at repository or organization level.
    evidence:
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.github/ISSUE_TEMPLATE/config.yml#L1-L11
