schema_version: 1
project: epic
pass: '2026-10-12'
commit: 2e1d4f73eed9201b8d1ad925497fee96fe55726b
assessor: { agent: claude-code, model: claude-opus-5-5 }
summary: >-
  The main risks are a default branch that passed CI in 68% of recent runs (remote XRootD input
  timeouts in the npsim-dis jobs), no CODEOWNERS or maintainer list with all 24-month releases cut by
  one person, and missing user and developer documentation (no dependency versions, no eic-shell
  route, no API reference or architecture overview). Established practices are protected-branch PR
  review (98.7% of changes via PRs, 97.3% reviewed), eic-shell CI with GCC/Clang builds, per-configuration
  geometry and overlap checks, npsim and EICrecon end-to-end jobs with capybara comparisons, monthly
  releases with Zenodo DOIs, and same-day eic-spack packaging that ships every release in eic-shell.
criteria:
  eng.change-control:
    level: 3
    confidence: high
    rationale: >-
      98.7% of first-parent commits in 12 months came through PRs and 97.3% of merged PRs had a
      non-author review; the default branch is protected and CONTRIBUTING.md and a PR template document
      the one-reviewer requirement.
    evidence:
      - metrics:git.first_parent_pr_fraction_12m = 0.987
      - metrics:prs.reviewed_fraction_12m = 0.973
      - metrics:repo.default_branch_protected = true
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.github/CONTRIBUTING.md#L12-L26
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.github/pull_request_template.md#L1-L19
    gaps: []
    actions: []
  eng.ci:
    level: 1
    confidence: high
    rationale: >-
      `linux-eic-shell.yml` builds on every PR, merge-group and push to main with geometry, overlap,
      npsim and EICrecon jobs and required status checks, but only 68% of recent default-branch runs
      succeeded, below the 80% needed for level 2.
    evidence:
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.github/workflows/linux-eic-shell.yml#L1-L11
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.github/workflows/linux-eic-shell.yml#L50-L102
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.github/workflows/linux-eic-shell.yml#L709-L735
      - metrics:ci.default_branch_success_rate = 0.68
      - https://github.com/eic/epic/actions/runs/37795970966
    gaps:
      - Default-branch success rate is 68%; recent failures are `npsim-dis` jobs timing out on remote XRootD input (`TNetXNGFile::Open` socket timeout) and a `dawn-view-slices` job.
    actions:
      - action: Cache the `npsim-dis` HepMC3 input files with `actions/cache` (or retry the XRootD read) in `.github/workflows/linux-eic-shell.yml` so remote-server timeouts no longer fail main.
        priority: high
        effort: S
  eng.testing:
    level: 2
    confidence: medium
    rationale: >-
      Every PR builds all 77 configurations (including per-subsystem `*_only` configurations) and runs
      `checkGeometry`, `g4GeometryScan`, TGeo and Geant4 overlap checks and npsim/EICrecon end-to-end
      jobs with capybara comparisons against main; coverage is not measured and 1.8% of merged PRs touch
      test files.
    evidence:
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.github/workflows/check-geometry-configs.yml#L24-L43
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.github/workflows/linux-eic-shell.yml#L322-L346
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.github/workflows/linux-eic-shell.yml#L572-L638
      - metrics:code.test_files = 1
      - metrics:prs.test_touching_fraction_12m = 0.018
    gaps:
      - No test coverage of the detector plugins is measured or published.
      - Only 1.8% of merged PRs in 12 months touch test files; there are no per-plugin tests of constructed dimensions or parameters.
      - Capybara comparisons produce reports but do not fail CI on differences.
    actions:
      - action: Add a gcov/Codecov job that runs the per-configuration `checkGeometry` loop on a coverage build and publishes plugin coverage.
        priority: medium
        effort: M
      - action: Add a scripted check (e.g. `scripts/subdetector_tests/`) that compares dumped constants or material scans against stored references and is required for PRs that change `src/` or `compact/`.
        priority: medium
        effort: M
  eng.static-quality:
    level: 2
    confidence: high
    rationale: >-
      clang-format and pre-commit hygiene hooks run through pre-commit.ci, xmllint and SPDX-header
      checks run on every PR, and non-Release builds use `-Wall -Wextra -Werror -pedantic`; no
      clang-tidy, cppcheck or sanitizer job runs.
    evidence:
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.pre-commit-config.yaml#L1-L19
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.github/workflows/linux-eic-shell.yml#L18-L25
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.github/workflows/spdx.yml#L1-L14
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/CMakeLists.txt#L30-L36
    gaps:
      - No deeper static analysis (clang-tidy, cppcheck) or sanitizer build, although `CMAKE_EXPORT_COMPILE_COMMANDS` is set for clang-tidy.
    actions:
      - action: Add a clang-tidy job on changed `src/` files using the exported `compile_commands.json` from the eic-shell build.
        priority: medium
        effort: S
  eng.modularity:
    level: 2
    confidence: high
    rationale: >-
      Each detector is a DD4hep plugin in `src/` configured by compact XML and YAML/Jinja2
      configurations, built with CMake (C++17) and installed with a setup script; there is no exported
      CMake package config and no architecture documentation.
    evidence:
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/CMakeLists.txt#L15-L22
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/CMakeLists.txt#L58-L131
      - metrics:code.cxx_standard = [17]
      - metrics:code.largest_source_files[0] = src/LFHCAL_geo.cpp (1175 lines)
    gaps:
      - No `install(EXPORT ...)` or package config for downstream CMake consumers; consumers rely on `thisepic.sh` environment variables.
      - The plugin, compact-file and configuration-template architecture is not documented (`templates/README.md` is 3 lines).
    actions:
      - action: Add `docs/architecture.md` describing plugins, compact files, the Jinja2 configuration templates and the FileLoader, and install an `epicConfig.cmake`.
        priority: medium
        effort: M
  doc.user:
    level: 1
    confidence: high
    rationale: >-
      The README gives cmake build and `thisepic.sh` instructions and links a hosted geometry viewer,
      but names no dependencies or versions, does not describe the eic-shell route (it links retired
      eicweb tutorial and container pages), and has no runnable example.
    evidence:
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/README.md#L27-L82
      - metrics:repo.homepage = https://eic.github.io/epic
    gaps:
      - Dependencies (DD4hep >= 1.27, ROOT, fmt, optional IRT2, jinja2) and versions are not listed in the README.
      - No eic-shell quick start and no runnable example (e.g. an `npsim` or `checkOverlaps` command).
      - Detector configurations and `DETECTOR_CONFIG` options are not documented for users.
    actions:
      - action: Add an "Installation" README section naming dependencies with minimum versions and the eic-shell route (`/opt/detector` builds and `source install/bin/thisepic.sh`), and link the EIC geometry-development tutorial.
        priority: medium
        effort: S
      - action: Add a quick-start example running `npsim` on `epic_craterlake.xml` and a table of the configurations in `configurations/`.
        priority: medium
        effort: S
  doc.developer:
    level: 1
    confidence: high
    rationale: >-
      27 of 61 plugin sources carry Doxygen-style comments, but there is no Doxygen configuration, no
      generated API reference and no architecture overview.
    evidence:
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/src/BarrelTrackerWithFrame_geo.cpp#L4-L10
      - metrics:files.doxygen = []
    gaps:
      - No generated API documentation of plugin XML parameters.
      - No architecture overview of how plugins, compact files and configuration templates fit together.
    actions:
      - action: Add a `Doxyfile` and a job in `linux-eic-shell.yml` that publishes the generated plugin reference with the existing GitHub Pages artifacts site.
        priority: medium
        effort: M
  doc.contributing:
    level: 1
    confidence: medium
    rationale: >-
      `.github/CONTRIBUTING.md` covers the PR process, review requirement and clang-format/no-warning
      conventions, and issue and PR templates exist, but it does not describe setting up the
      development environment or running the geometry checks locally.
    evidence:
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.github/CONTRIBUTING.md#L1-L31
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.github/ISSUE_TEMPLATE/config.yml#L1-L11
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.devcontainer/devcontainer.json#L1-L4
    gaps:
      - CONTRIBUTING.md has no development-environment setup (eic-shell or the devcontainer) and no instructions for running `checkGeometry`/`checkOverlaps` locally.
    actions:
      - action: Extend `.github/CONTRIBUTING.md` with eic-shell/devcontainer setup, the cmake build, and the `checkGeometry` and `scripts/checkOverlaps.py` commands CI runs.
        priority: medium
        effort: S
  com.responsiveness:
    level: 1
    confidence: high
    rationale: >-
      Median first response is 1.6 days and PRs are reviewed, but 58 of 66 open issues are older than
