  dist.dependencies:
    level: 1
    confidence: high
    rationale: >-
      `CMakeLists.txt` requires DD4hep >= 1.27 and IRT2 >= 2.1.1, but `fmt` and the `requirements.txt`
      Python packages have no version constraints; Dependabot monitors only GitHub Actions.
    evidence:
