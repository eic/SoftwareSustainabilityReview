schema_version: 1
project: edm4eic
pass: '2026-10-12'
commit: 9b48c1d15c44ec7bf8a599be0df60606fc3f1828
assessor: { agent: claude-code, model: claude-opus-5-5 }
summary: >-
  The main risks are that CI builds but never runs the project's ctest suite, that no formatter,
  linter, code of conduct, contribution guide or documented version scheme exists, and that 21 of 25
  open issues are older than one year. Established practices are PR-only changes with branch protection
  requiring one approving review and the `build-test` check (95.8% of merged PRs reviewed), weekly and
  per-PR builds in eic-shell nightly with a downstream eic_container/benchmark trigger, and eic-spack
  packaging that ships the latest release (8.10.0) in eic-shell.
criteria:
  eng.change-control:
    level: 3
    confidence: high
    rationale: >-
      All first-parent commits in 12 months came through PRs and 95.8% of merged PRs were reviewed by a
      non-author; branch protection on `main` requires one approving and code-owner review (enforced for
      admins), and a PR template sets expectations.
    evidence:
      - metrics:git.first_parent_pr_fraction_12m = 1.0
      - metrics:prs.reviewed_fraction_12m = 0.958
      - metrics:repo.default_branch_protected = true
      - https://github.com/eic/EDM4eic/blob/9b48c1d15c44ec7bf8a599be0df60606fc3f1828/.github/CODEOWNERS#L1
      - https://github.com/eic/EDM4eic/blob/9b48c1d15c44ec7bf8a599be0df60606fc3f1828/.github/pull_request_template.md#L1-L19
    gaps: []
    actions: []
  eng.ci:
    level: 1
    confidence: high
    rationale: >-
      `linux-eic-shell.yml` builds and installs on every PR, push and weekly (97.6% success on `main`) and
      triggers the downstream eic_container and benchmark pipelines, but it never runs `ctest`, so the
      project's own tests are not executed.
    evidence:
      - https://github.com/eic/EDM4eic/blob/9b48c1d15c44ec7bf8a599be0df60606fc3f1828/.github/workflows/linux-eic-shell.yml#L3-L25
