      - metrics:ci.default_branch_success_rate = 0.976
      - https://eicweb.phy.anl.gov/containers/eic_container/-/pipelines/150013
    gaps:
      - The build-test job runs `cmake --build build -- install` only; the `write_events`/`read_events` ctest tests are never executed.
      - The downstream eicweb/eic_container and benchmark statuses failed on the assessed commit and are not required checks.
      - The legacy `.gitlab-ci.yml` targets a `master` branch and the retired juggler pipeline and does not run.
    actions:
      - action: Add `ctest --test-dir build --output-on-failure` to the `run:` block of the build-test step in `.github/workflows/linux-eic-shell.yml`.
