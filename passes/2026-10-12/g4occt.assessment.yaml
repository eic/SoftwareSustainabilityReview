    gaps: []
    actions: []
  eng.static-quality:
    level: 2
    confidence: high
    rationale: >-
      pre-commit.ci runs clang-format, cmake-lint, codespell and markdownlint on every PR, IWYU fails PRs
      that need include changes, sanitizers are required checks, and CI builds with -Wall -Werror; clang-tidy
      runs but its result is discarded with `|| true`.
    evidence:
      - https://github.com/eic/G4OCCT/blob/c58db1b0cda140d447d37e3a499a9b8306d0b93a/.pre-commit-config.yaml#L1-L41
      - https://github.com/eic/G4OCCT/blob/c58db1b0cda140d447d37e3a499a9b8306d0b93a/.github/workflows/iwyu.yml#L125-L133
      - https://github.com/eic/G4OCCT/blob/c58db1b0cda140d447d37e3a499a9b8306d0b93a/CMakeLists.txt#L47-L53
      - https://github.com/eic/G4OCCT/blob/c58db1b0cda140d447d37e3a499a9b8306d0b93a/.github/workflows/ci.yml#L236-L258
      - https://github.com/eic/G4OCCT/blob/c58db1b0cda140d447d37e3a499a9b8306d0b93a/.github/workflows/ci.yml#L738-L823
      - https://github.com/eic/G4OCCT/blob/c58db1b0cda140d447d37e3a499a9b8306d0b93a/.github/lsan.supp#L153-L154
    gaps:
      - clang-tidy findings never fail CI (`|| true`) and are not tracked to zero.
      - "LSan suppresses all OCCT allocations (`leak:Standard::Allocate`, `leak:NCollection_IncAllocator::Allocate`)."
    actions:
      - action: Remove `|| true` from the clang-tidy-diff step in `ci.yml` so new clang-tidy findings on changed lines fail the PR.
        priority: medium
        effort: S
      - action: Replace the allocator-wide LSan suppressions with caller-scoped entries or explicit cleanup at test teardown.
        priority: low
        effort: M
  eng.modularity:
    level: 3
    confidence: medium
    rationale: >-
      A C++20 CMake library with public headers in `include/G4OCCT/`, internal kernel headers in `src/`,
      an exported `G4OCCT::G4OCCT` package config, a separately installed DD4hep plugin, XML-based
      material and sensitive-detector maps, and documented architecture; the largest file has 1273 lines.
    evidence:
