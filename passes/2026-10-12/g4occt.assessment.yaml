schema_version: 1
project: g4occt
pass: "2026-10-12"
commit: c58db1b0cda140d447d37e3a499a9b8306d0b93a
assessor: { agent: claude-code, model: claude-opus-5-5 }
summary: >-
  One author wrote 99.2% of non-bot commits in 24 months and is the only human reviewer, merger and
  release author; 0.8% of merged PRs have a review from someone other than the author, and there is
  no citation metadata, code of conduct or maintainer list. CI builds in eic_xl:nightly with -Werror,
  runs gtest unit tests, per-fixture geometry comparisons against native Geant4 solids, DD4hep plugin
  tests, ASan/UBSan/TSan, IWYU and coverage (published, 47.5% of PRs touch tests), and Doxygen and
  design docs are deployed by CI. The package is in eic-spack at the latest release (0.3.0) but
  eic-shell still ships 0.2.1, and no other EIC repository depends on it yet.
criteria:
  eng.change-control:
    level: 1
    confidence: high
    rationale: >-
      97.1% of first-parent commits arrive through PRs and a ruleset requires PRs and eight status
      checks, but only 0.8% of merged PRs have a review from someone other than the author (the
      ruleset requires 0 approvals; reviews come from the Copilot bot or the author).
    evidence:
      - metrics:git.first_parent_pr_fraction_12m = 0.971
      - metrics:prs.reviewed_fraction_12m = 0.008
      - metrics:repo.rulesets = 2
      - metrics:files.codeowners = []
      - https://github.com/eic/G4OCCT/pull/398
      - https://github.com/eic/.github/blob/3231e4d33f430f9806db8703b2feaafca084e18e/.github/pull_request_template.md
    gaps:
      - Fewer than 50% of merged PRs are reviewed by someone other than the author.
      - The "Default" ruleset sets `required_approving_review_count` to 0 and lets the admin role bypass it always.
      - No CODEOWNERS file.
    actions:
      - action: Recruit a second human reviewer and set `required_approving_review_count` to 1 in the "Default" ruleset.
        priority: high
        effort: M
      - action: Add `.github/CODEOWNERS` naming at least two reviewers for `src/`, `include/` and `src/dd4hep/`.
        priority: medium
        effort: S
  eng.ci:
    level: 2
    confidence: high
    rationale: >-
      `ci.yml` runs on every PR and push to `main`, builds in eic_xl with -Werror, runs ctest, the B1/B4c
      examples and DD4hep plugin tests, and eight jobs are required checks; 84% of default-branch runs
      succeeded and the latest two `main` runs fail (ASan leak reports in TGeoOCCTSolid tests).
    evidence:
      - https://github.com/eic/G4OCCT/blob/c58db1b0cda140d447d37e3a499a9b8306d0b93a/.github/workflows/ci.yml#L6-L10
      - https://github.com/eic/G4OCCT/blob/c58db1b0cda140d447d37e3a499a9b8306d0b93a/.github/workflows/ci.yml#L38-L79
      - https://github.com/eic/G4OCCT/blob/c58db1b0cda140d447d37e3a499a9b8306d0b93a/.github/workflows/ci.yml#L134-L161
      - https://github.com/eic/G4OCCT/blob/c58db1b0cda140d447d37e3a499a9b8306d0b93a/.github/workflows/ci.yml#L825-L879
      - metrics:ci.default_branch_success_rate = 0.84
      - https://github.com/eic/G4OCCT/actions/runs/34890504065
    gaps:
      - Default-branch success rate is below 90%; `main` is red since 2026-09-14 (3 ASan test failures) and `TGeoOCCTSolid.RootDrawingSmoke` also failed on `main` in August.
      - CI tests only the eic_xl nightly stack, not the declared minimum versions (Geant4 11.3, OCCT 7.8).
      - The admin role can bypass the required status checks.
    actions:
      - action: Fix or quarantine the failing `TGeoOCCTSolid.*` tests under ASan so `main` passes, and add a `schedule:` trigger to `ci.yml` to detect nightly-stack breakage.
        priority: medium
        effort: S
      - action: Add a CI job building and testing against Geant4 11.3 and OCCT 7.8 (e.g. from `.github/spack.yaml` with pinned versions).
        priority: medium
        effort: M
  eng.testing:
    level: 3
    confidence: high
    rationale: >-
      gtest unit tests cover each library class, per-fixture CTest tests compare OCCT navigation results
      against native Geant4 solids and recorded volume expectations, DD4hep plugin and example runs act
      as integration tests, coverage is published, and 47.5% of merged PRs touch tests.
    evidence:
      - https://github.com/eic/G4OCCT/blob/c58db1b0cda140d447d37e3a499a9b8306d0b93a/src/tests/CMakeLists.txt#L20-L27
      - https://github.com/eic/G4OCCT/blob/c58db1b0cda140d447d37e3a499a9b8306d0b93a/src/tests/CMakeLists.txt#L164-L196
      - https://github.com/eic/G4OCCT/blob/c58db1b0cda140d447d37e3a499a9b8306d0b93a/src/tests/fixtures/geometry/README.md
