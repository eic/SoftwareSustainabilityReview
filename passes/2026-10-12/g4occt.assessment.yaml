      - https://github.com/eic/G4OCCT/blob/c58db1b0cda140d447d37e3a499a9b8306d0b93a/CMakeLists.txt#L300-L332
      - https://github.com/eic/G4OCCT/blob/c58db1b0cda140d447d37e3a499a9b8306d0b93a/README.md#L44-L63
