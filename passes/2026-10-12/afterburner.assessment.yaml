schema_version: 1
project: afterburner
pass: "2026-10-12"
commit: 740f6356225fc81c9baee5c76d6dd19976c99417
assessor: { agent: claude-code, model: claude-opus-5-5 }
summary: >-
  The repository has no license (issue #1 open since 2022), no code of conduct, and no citation
  metadata; 4 of 5 issues opened in 12 months received no response, and one author wrote 52% of
  commits in 24 months. All default-branch changes in 12 months arrived through reviewed PRs under
  branch protection, and the latest release (v0.2.1) is packaged in eic-spack and shipped in
  eic-shell, where it is used in ePIC simulation campaigns.
criteria:
  eng.change-control:
    level: 3
    confidence: medium
    rationale: >-
      All 12 first-parent commits in 12 months came from PRs (the 4 non-merge commits are squash
      merges of PRs #15, #21, #23 and #26, so the 0.667 metric undercounts), every merged PR was
      reviewed, branch protection requires one approving review, and the eic organization PR
      template applies.
    evidence:
      - metrics:git.first_parent_pr_fraction_12m = 0.667
      - metrics:prs.reviewed_fraction_12m = 1.0
      - metrics:repo.default_branch_protected = true
      - https://github.com/eic/afterburner/pull/26
      - https://github.com/eic/afterburner/pull/15
      - https://github.com/eic/.github/blob/3231e4d33f430f9806db8703b2feaafca084e18e/.github/pull_request_template.md
    gaps: []
    actions: []
  eng.ci:
    level: 1
    confidence: high
    rationale: >-
      The single workflow builds in eic-shell and runs one end-to-end smoke run on PRs to `main`, but
      it has no `push` trigger, so the default branch is never built, and it runs no test suite.
    evidence:
      - https://github.com/eic/afterburner/blob/740f6356225fc81c9baee5c76d6dd19976c99417/.github/workflows/linux-eic-shell.yml#L2-L5
      - https://github.com/eic/afterburner/blob/740f6356225fc81c9baee5c76d6dd19976c99417/.github/workflows/linux-eic-shell.yml#L43-L58
      - metrics:ci.default_branch_runs = 0
    gaps:
      - The workflow does not run on pushes to `main`; default-branch success rate cannot be measured.
      - CI checks only that output files exist; no test suite (ctest/pytest) runs.
      - Branch protection has no required status checks.
    actions:
      - action: "Add `push: branches: [main]` to the `on:` block of `.github/workflows/linux-eic-shell.yml`."
        priority: medium
        effort: S
      - action: Run `pytest python/test_abconv.py` with `TEST_ABCONV_EXE=install/bin/abconv` (and `ctest` once tests are registered) in the "Run test" step.
        priority: medium
        effort: S
  eng.testing:
    level: 1
    confidence: high
    rationale: >-
      The only test file checks that `abconv --help` prints usage and is not run in CI; CI runs one
      end-to-end conversion and checks only that output files exist, with no unit tests of the
      afterburner algorithms.
    evidence:
      - https://github.com/eic/afterburner/blob/740f6356225fc81c9baee5c76d6dd19976c99417/python/test_abconv.py#L12-L18
      - https://github.com/eic/afterburner/blob/740f6356225fc81c9baee5c76d6dd19976c99417/.github/workflows/linux-eic-shell.yml#L48-L56
      - metrics:prs.test_touching_fraction_12m = 0.0
      - https://github.com/eic/afterburner/issues/11
    gaps:
      - No unit tests for `Afterburner`, `Smearer` or `EicConfigurator` presets.
      - "`enable_testing()` is called but no tests are registered with CTest."
      - The Pythia8 comparison in `python/comparison.ipynb` is manual and not automated.
    actions:
      - action: Add Catch2 unit tests under `cpp/tests/` for `Smearer` and `Afterburner::process_event` (crossing angle and vertex widths per preset) registered with `add_test`.
        priority: medium
        effort: M
      - action: Assert in CI that output vertex and angle distributions of the generated sample match expected crossing angle and widths within tolerance.
        priority: medium
        effort: M
  eng.static-quality:
    level: 0
    confidence: high
    rationale: >-
      No formatter, linter, static analyzer or compiler warning flags are configured in the
      repository or CI.
    evidence:
      - metrics:files.clang_format = []
      - metrics:files.pre_commit = []
      - https://github.com/eic/afterburner/blob/740f6356225fc81c9baee5c76d6dd19976c99417/cpp/CMakeLists.txt#L1-L50
    gaps:
      - No `.clang-format`, `.clang-tidy` or pre-commit configuration.
