        effort: S
  eng.modularity:
    level: 1
    confidence: high
    rationale: >-
      CMake builds a static `afterburner` library, a `benchmark` library and the `abconv` tool with
      C++20, but all beam presets are compiled into a 2172-line `EicConfigurator.cc` and only the
      `abconv` executable is installed (no library, headers or package config).
    evidence:
      - https://github.com/eic/afterburner/blob/740f6356225fc81c9baee5c76d6dd19976c99417/cpp/CMakeLists.txt#L5-L9
      - https://github.com/eic/afterburner/blob/740f6356225fc81c9baee5c76d6dd19976c99417/cpp/afterburner/EicConfigurator.cc#L13-L50
      - https://github.com/eic/afterburner/blob/740f6356225fc81c9baee5c76d6dd19976c99417/cpp/abconv/CMakeLists.txt#L56
      - https://github.com/eic/afterburner/blob/740f6356225fc81c9baee5c76d6dd19976c99417/beam_configs/default.yaml#L1-L18
      - https://github.com/eic/afterburner/issues/27
    gaps:
      - Beam parameters are hard-coded in C++; `beam_configs/default.yaml` is placeholder content and YAML loading is not implemented.
      - The `afterburner` library and headers are not installed, although the README advertises a C++ API.
      - "`cpp/afterburner/CMakeLists.txt` references a non-existent `../external/json_struct/` directory."
    actions:
      - action: Move the beam presets from `EicConfigurator.cc` into YAML files under `beam_configs/` loaded at run time (issue #27).
        priority: medium
        effort: M
      - action: Install the `afterburner` library and its headers with `install(TARGETS ... EXPORT)` and `install(DIRECTORY ...)`.
        priority: medium
        effort: S
  doc.user:
    level: 1
    confidence: high
    rationale: >-
      The README has build steps, CLI examples and an options table, but lists only yaml-cpp as a
      dependency although CMake requires HepMC3, CLHEP, GSL and ROOT, gives no versions, and has no
      runnable example input.
    evidence:
      - https://github.com/eic/afterburner/blob/740f6356225fc81c9baee5c76d6dd19976c99417/README.md#L20-L44
      - https://github.com/eic/afterburner/blob/740f6356225fc81c9baee5c76d6dd19976c99417/README.md#L122-L137
      - https://github.com/eic/afterburner/blob/740f6356225fc81c9baee5c76d6dd19976c99417/cpp/CMakeLists.txt#L16-L31
      - https://github.com/eic/tutorial-analysis/blob/3739c6e78d10101f08d216048aca578a30faef14/episodes/04-full_chain_analysis.md
    gaps:
      - HepMC3, CLHEP, GSL and ROOT and all minimum versions are missing from the install instructions.
      - Examples use a user-supplied `my.hepmc`; `python/gen_hepmc_event.py` is not documented as a quick-start input.
      - README links to beam parameters point to the old eicweb.phy.anl.gov repository.
    actions:
      - action: List every `find_package` dependency with minimum versions in the README "Installation" section and state that eic-shell provides them.
        priority: medium
        effort: S
      - action: Add a README quick start that generates input with `python/gen_hepmc_event.py` and runs `abconv` on it.
        priority: medium
        effort: S
  doc.developer:
    level: 1
    confidence: high
    rationale: >-
