    actions:
      - action: Add `.clang-format` and `.pre-commit-config.yaml` with clang-format and enable pre-commit.ci.
        priority: high
        effort: S
      - action: Add `target_compile_options(... PRIVATE -Wall -Wextra -Wpedantic)` to the three targets in `cpp/*/CMakeLists.txt`.
