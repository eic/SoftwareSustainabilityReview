        priority: medium
        effort: S
  com.conduct:
    level: 1
    confidence: high
    rationale: >-
      Support channels exist (issue tracker with a question template and the dd4hep-developers mailing
      list), but no code of conduct applies to the repository or the AIDASoft organization.
    evidence:
      - metrics:community.files.code_of_conduct = false
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/.github/ISSUE_TEMPLATE/question.md
      - https://dd4hep.web.cern.ch/dd4hep/
    gaps:
      - No code of conduct with a reporting contact.
    actions:
      - action: Add `CODE_OF_CONDUCT.md` (for example the CERN Code of Conduct or Contributor Covenant) with a reporting contact.
        priority: high
        effort: S
  dist.packaging:
    level: 3
    confidence: high
    rationale: >-
      Upstream Spack provides 1.38, which is the latest release v01-38 and the version eic-shell ships
      (the collector's `latest_release_packaged = false` reflects the `v01-38` tag naming).
    evidence:
      - metrics:packaging.spack_builtin.versions = ["master", "1.38", "1.37", "1.36", "1.35"]
      - metrics:packaging.in_eic_shell = true
      - metrics:packaging.eic_shell_version = 1.38
      - metrics:releases.latest_tag = v01-38
    gaps: []
    actions: []
  dist.releases:
    level: 1
    confidence: medium
