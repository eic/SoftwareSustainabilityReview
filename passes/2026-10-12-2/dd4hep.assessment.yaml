      - action: Document the label scheme and triage practice in `.github/CONTRIBUTING.md`.
        priority: medium
        effort: S
  com.contributors:
    level: 3
    confidence: high
    rationale: >-
      32 authors in 24 months from 9 e-mail domains, 13 new authors in 12 months, and 23.9% of merged PRs
