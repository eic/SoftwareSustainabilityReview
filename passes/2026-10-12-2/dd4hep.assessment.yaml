      - Coding conventions are limited to "no new warnings".
    actions:
      - action: Extend `.github/CONTRIBUTING.md` with an LCG-view or Key4hep setup, the CMake build, `ctest`, and Python/C++ style rules.
        priority: medium
        effort: S
  com.responsiveness:
    level: 2
    confidence: medium
    rationale: >-
      Median first response is 0.32 days, no issue went unanswered and 80% are labeled, but 5 of 13 open
