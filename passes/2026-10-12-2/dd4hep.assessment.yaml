        effort: S
  dist.dependencies:
    level: 1
    confidence: high
    rationale: >-
      ROOT, Boost, Geant4, EDM4hep and podio have minimum versions, but LCIO, HepMC3, TBB, Xerces-C and
      G4HepEm do not, and TinyXML 2.5.2 (unmaintained upstream) and a copy of GaudiPluginService are
      vendored.
    evidence:
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/CMakeLists.txt#L147-L224
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/DDCore/include/XML/tinyxml.h#L98-L100
      - https://github.com/AIDASoft/DD4hep/tree/78ca69c4b2cc8130b6ff9948f458c539ac81433e/GaudiPluginService
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/.github/dependabot.yml
    gaps:
      - Several `find_package` calls have no minimum version.
      - Unmaintained vendored TinyXML 2.5.2 remains as the default XML parser.
    actions:
      - action: Add minimum versions to `find_package` for LCIO, HepMC3, TBB, XercesC and G4HepEm in `CMakeLists.txt`.
        priority: medium
        effort: S
      - action: Replace the vendored TinyXML 2.5.2 with an external maintained parser (TinyXML2 or Xerces-C as default).
        priority: medium
        effort: L
  dist.reproducibility:
    level: 2
    confidence: medium
    rationale: >-
      CI runs in pinned LCG views (LCG_101, LCG_106, LCG_107a) and the install page documents sourcing an
      LCG view; ddsim writes DD4hep and Geant4 versions, all steering parameters and the command line into
      the run header. No environment is versioned with each DD4hep release.
    evidence:
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/.github/workflows/linux.yml#L21-L28
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/DDG4/python/DDSim/Helper/Meta.py#L71-L114
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/DDG4/edm4hep/Geant4Output2EDM4hep.cpp#L407-L410
    gaps:
      - Releases do not name a tested environment (LCG or Key4hep release) to reproduce them.
    actions:
      - action: State in each release note the LCG and Key4hep stacks the release was tested in.
        priority: medium
        effort: S
  dist.portability:
    level: 2
    confidence: high
    rationale: >-
      CI builds and tests with GCC 11/13/15 and Clang 22 on EL9, CentOS 7 and Ubuntu 24.04; macOS is built
      but not tested, there is no aarch64 job, and accelerator support is not addressed.
    evidence:
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/.github/workflows/linux.yml#L21-L28
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/.github/workflows/mac.yml#L15-L28
      - metrics:ci.runs_on = ["macos-latest", "ubuntu-latest"]
      - metrics:code.site_specific_paths
    gaps:
      - No tests on macOS or aarch64.
      - No documentation of batch/HPC use or of why accelerators are not supported.
      - Three example scripts contain `/afs/` or personal home paths.
    actions:
      - action: Add an `ubuntu-24.04-arm` job and run `ctest` in the macOS job.
        priority: medium
        effort: M
  eic.reuse:
    level: 3
    confidence: medium
    rationale: >-
      DD4hep builds on ROOT, Geant4, HepMC3 and podio/EDM4hep, its HepMC2 ASCII reader is a documented
      fallback when HepMC3 is not built, and it is itself the geometry component reused by epic, EICrecon
      and npsim.
    evidence:
      - metrics:eic.domain_components = ["edm4hep", "geant4", "hepmc3", "npsim", "podio"]
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/DDG4/python/DDSim/Helper/HepMC3.py#L14-L23
      - metrics:packaging.eic_spack_dependents = ["algorithms", "eic-ip6", "eicrecon", "epic", "g4occt", "juggler", "npdet", "npsim", "simphony"]
    gaps: []
    actions: []
  eic.data-model:
    level: 2
    confidence: medium
    rationale: >-
      DD4hep defines the compact XML geometry format, reads HepMC3 and EDM4hep and writes EDM4hep, and
      its EDM4hep outputs are read back in tests by PyROOT. The default `.root` output uses DD4hep-native
      classes that need DD4hep dictionaries, and file data-model versions are not checked on read.
    evidence:
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/DDG4/edm4hep/Geant4Output2EDM4hep.cpp#L390-L415
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/DDTest/CMakeLists.txt#L188-L196
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/DDTest/python/compare_simulation_output.py#L22-L26
    gaps:
      - The EDM4hep version of input files is checked only at compile time, not on read.
      - The default ddsim `.root` output cannot be read without DD4hep libraries.
    actions:
      - action: Check the EDM4hep schema version from the podio metadata in `EDM4hepFileReader.cpp` and warn on mismatch.
        priority: medium
        effort: S
  eic.environment:
    level: 2
    confidence: medium
    rationale: >-
      eic/containers builds DD4hep 1.38 for eic-shell and the epic CI runs DD4hep tools (checkGeometry,
      npsim) in `eic_xl:nightly` and a pinned stable release, but both use released DD4hep, so no EIC
      CI tests DD4hep `master` before a release (calibrated against podio, ACTS, ROOT and EDM4hep in
      this pass).
    evidence:
      - https://github.com/eic/containers/blob/a5bead855571a4df268ee89cd4030c58c14ce795/spack-environment/packages.yaml#L134-L138
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.github/workflows/linux-eic-shell.yml#L50-L66
      - https://github.com/eic/epic/blob/2e1d4f73eed9201b8d1ad925497fee96fe55726b/.github/workflows/linux-eic-shell.yml#L356-L366
      - metrics:ci.uses_eic_shell = false
    gaps:
      - No EIC CI builds DD4hep `master` or release candidates in an eic container, so incompatibilities surface only after a release.
    actions:
      - action: (EIC side) Add a scheduled eic/containers or epic CI job that builds DD4hep `master` in `eic_ci:nightly` and runs the epic geometry checks.
        priority: medium
        effort: M
  eic.currency:
    level: 2
    confidence: medium
    rationale: >-
      DD4hep 1.38 is the version in current eic-shell and CI tracks ROOT and Geant4 development stacks,
      but `DrawBField.cpp` includes ROOT headers `Hoption.h`/`Hparam.h` that emit deprecation warnings
      in the dev3 CI build.
    evidence:
      - metrics:packaging.eic_shell_version = 1.38
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/DDCore/src/graphics/DrawBField.cpp#L33-L37
      - https://github.com/AIDASoft/DD4hep/actions/runs/37940902195
    gaps:
      - Uses ROOT headers deprecated for removal in ROOT 6.44.
      - Compatibility code for podio < 1.0 and EDM4hep < 1.0 remains.
    actions:
      - action: Replace `Hoption.h`/`Hparam.h` in `DDCore/src/graphics/DrawBField.cpp` with the public `THistPainter` interface.
        priority: medium
        effort: S
      - action: (EIC side) Add a scheduled eic-shell job that builds DD4hep `master` and runs the epic geometry checks before each DD4hep release.
        priority: low
        effort: M
  via.license:
    level: 1
    confidence: high
    rationale: >-
      LGPL-3.0 is detected and declared in Spack, but the bundled GaudiPluginService is GPL-3.0 with its
      own LICENCE and is built into the DD4hep libraries, and the user manual states that DD4hep is GPLv3.
    evidence:
      - metrics:repo.license_spdx = LGPL-3.0
