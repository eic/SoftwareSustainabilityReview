      Nine releases in 24 months each have notes generated from PR descriptions, but the `vXX-YY` version
      scheme is not documented anywhere.
    evidence:
      - metrics:releases.count_24m = 9
      - metrics:releases.with_notes_fraction_24m = 1.0
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/doc/ReleaseNotes.md#L1-L10
    gaps:
      - No documented version scheme.
      - No flagged breaking changes, deprecation policy, or release workflow.
    actions:
      - action: State the version scheme (major.minor.patch mapped to `vXX-YY[-ZZ]` tags) and its compatibility meaning in `README.md`.
