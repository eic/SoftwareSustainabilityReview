schema_version: 1
project: dd4hep
pass: "2026-10-12-2"
commit: 78ca69c4b2cc8130b6ff9948f458c539ac81433e
assessor: { agent: claude-code, model: claude-opus-5-5 }
summary: >-
  Only 33% of merged PRs have a recorded review, there is no C++ formatter, no code of conduct, no
  documented governance or version scheme, all 9 releases in 24 months were cut by one person, and a
  GPL-3.0 copy of GaudiPluginService ships inside the LGPL-3.0 project. CI builds and runs the core and
  example ctest suites, including reference-shape and multi-thread output comparisons, on 8 LCG
  stacks plus the Key4hep nightly, and it is required before merge. The latest release (1.38) ships in
  eic-shell and in upstream Spack, and 32 authors from 9 e-mail domains contributed in 24 months.
criteria:
  eng.change-control:
    level: 1
    confidence: high
    rationale: >-
      96.5% of first-parent commits arrive through PRs, but only 32.7% of merged PRs carry a review from
      someone other than the author, below the 50% required for level 2.
    evidence:
      - metrics:git.first_parent_pr_fraction_12m = 0.965
      - metrics:prs.reviewed_fraction_12m = 0.327
      - metrics:repo.default_branch_protected = true
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/.github/PULL_REQUEST_TEMPLATE#L1-L8
    gaps:
      - Fewer than 50% of merged PRs have a review by someone other than the author.
      - Branch protection requires status checks but no approving review, and there is no CODEOWNERS.
    actions:
      - action: Require one approving review in the `master` branch protection rule.
        priority: high
        effort: S
      - action: Add `.github/CODEOWNERS` assigning each top-level package (DDCore, DDG4, DDDigi, DDRec, ...) to at least one reviewer.
        priority: medium
        effort: S
  eng.ci:
    level: 2
    confidence: high
    rationale: >-
      Every PR and push builds and runs ctest for the core and the examples on 8 LCG stacks and the
      Key4hep nightly, the jobs are required status checks, and 94% of default-branch runs succeed. The
      macOS job only compiles (without Geant4) and runs no tests, although the manual declares macOS
      supported.
    evidence:
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/.github/workflows/linux.yml#L7-L28
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/.github/workflows/linux.yml#L90-L121
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/.github/workflows/mac.yml#L23-L28
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/doc/usermanuals/DD4hep/chapters/basics.tex#L19-L27
      - metrics:ci.default_branch_success_rate = 0.94
      - https://github.com/AIDASoft/DD4hep/actions/runs/37940902195
    gaps:
      - The declared macOS platform is built without Geant4 and no tests run on it.
      - The run on the assessed commit failed in the required `g4units` job (6 ddsim tests).
    actions:
      - action: Run `ctest` in `.github/workflows/mac.yml` with Geant4 enabled (see issue #1671 on an lcgcmake-based macOS install).
        priority: medium
        effort: M
  eng.testing:
    level: 2
    confidence: medium
    rationale: >-
      Unit tests in DDTest and example suites for DDCore, DDG4, DDDigi, DDCond, DDAlign, DDCAD and DDRec
      run in CI, with ddsim end-to-end runs and regression checks against reference shape meshes and
      between thread counts. Coverage is not measured and only 1.8% of merged PRs touch test files.
    evidence:
      - metrics:code.test_files = 36
      - metrics:prs.test_touching_fraction_12m = 0.018
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/DDTest/CMakeLists.txt#L145-L162
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/DDTest/CMakeLists.txt#L265-L278
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/examples/ClientTests/compact/Check_Shape_Box_Det.xml#L21
    gaps:
      - Test coverage is neither measured nor published (`metrics:files.codecov` is empty).
      - Fewer than 40% of merged PRs touch test files.
    actions:
      - action: Add a gcov/lcov build job to `.github/workflows/linux.yml` and upload results to Codecov.
        priority: medium
        effort: M
      - action: Ask in the PR template that bug-fix and feature PRs add or update a ctest.
        priority: medium
        effort: S
  eng.static-quality:
    level: 1
    confidence: high
    rationale: >-
      flake8 runs on every PR for Python, clang-tidy checks only header guards, Coverity runs nightly, and
      `-Wall -Wextra -pedantic` are set, but no C++ formatter is configured or enforced.
    evidence:
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/.github/workflows/python.yml#L26-L27
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/.github/workflows/clang-tidy.yml#L51-L55
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/.github/workflows/coverity.yml#L7-L10
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/cmake/DD4hepBuild.cmake#L42
      - metrics:files.clang_format = []
    gaps:
      - No `.clang-format` and no formatter enforced on C++ code.
      - clang-tidy runs only the `llvm-header-guard` check.
    actions:
      - action: Add `.clang-format` and a PR job (or pre-commit.ci) that checks formatting of changed C++ lines.
        priority: high
        effort: M
  eng.modularity:
    level: 3
    confidence: medium
    rationale: >-
      The code is split into packages (DDCore, DDG4, DDDigi, DDRec, DDCond, DDAlign) with separate
      `include/` and `src/` trees, requires C++17, exports a `DD4hep::` CMake package, loads detectors as
      plugins from compact XML, and has per-package user manuals.
    evidence:
      - metrics:code.cxx_standard = ["17"]
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/CMakeLists.txt#L56-L57
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/CMakeLists.txt#L331-L358
      - https://github.com/AIDASoft/DD4hep/tree/78ca69c4b2cc8130b6ff9948f458c539ac81433e/doc/usermanuals
    gaps: []
    actions: []
  doc.user:
    level: 1
    confidence: medium
    rationale: >-
      The hosted installation page lists minimum versions for CMake, Boost and ROOT and the beginners guide
      has runnable ddsim and geoDisplay examples, but Geant4, Xerces-C, HepMC3, EDM4hep and LCIO have no
      versions and the only distribution route is a CentOS 7 LCG_102b view.
    evidence:
      - https://dd4hep.web.cern.ch/dd4hep/page/installation/
      - https://dd4hep.web.cern.ch/dd4hep/page/beginners-guide
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/doc/usermanuals/DD4hep/chapters/basics.tex#L82
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/CMakeLists.txt#L147-L161
    gaps:
      - Optional dependencies have no minimum versions, and the documented Boost minimum (1.56) differs from CMake (1.70).
      - No Spack, Key4hep or eic-shell installation route is documented.
      - The manual's "Build From Source" section reads "NEED REWRITE ONCE FINALIZED".
    actions:
      - action: List minimum versions for every optional dependency on the installation page, matching `find_package` in `CMakeLists.txt`.
        priority: medium
        effort: S
      - action: Add `spack install dd4hep`, Key4hep and eic-shell routes to the installation page.
        priority: medium
        effort: S
  doc.developer:
    level: 3
    confidence: medium
    rationale: >-
      Public headers carry Doxygen comments, the Doxygen reference and LaTeX manuals are built and
