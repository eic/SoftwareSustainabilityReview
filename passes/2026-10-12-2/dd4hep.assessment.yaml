        priority: medium
        effort: S
  com.governance:
    level: 1
    confidence: medium
    rationale: >-
      The main developers are named on the website, but no decision process or maintainer path is
      documented and the milestones page lists 2019-2020 items only.
    evidence:
      - https://dd4hep.web.cern.ch/dd4hep/page/about/
      - https://dd4hep.web.cern.ch/dd4hep/page/milestones
      - metrics:files.governance = []
    gaps:
