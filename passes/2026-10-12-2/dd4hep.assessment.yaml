    evidence:
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/.gitlab-ci.yml#L72-L139
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/DDCore/include/DD4hep/Segmentations.h#L30-L80
      - https://dd4hep.web.cern.ch/dd4hep/reference/
      - https://github.com/AIDASoft/DD4hep/blob/78ca69c4b2cc8130b6ff9948f458c539ac81433e/doc/usermanuals/DD4hep/references.bib
