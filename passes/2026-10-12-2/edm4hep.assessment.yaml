schema_version: 1
project: edm4hep
pass: "2026-10-12-2"
commit: 2b569d9fb7085c28cd69b7d0cd129ee9bb178c90
assessor: { agent: claude-code, model: claude-opus-5-5 }
summary: >-
  25% of default-branch commits in 12 months were pushed directly (release-note, version and CI
  updates), rulesets require no approving review, there is no documented version scheme, governance,
  CODEOWNERS or linked code of conduct, and the downstream-build check failed on 8 of its last 10 runs. CI
  builds and runs ctest on every PR with GCC and Clang against podio main and Key4hep stacks, including
  backwards-compatibility reads of files written by older releases, and formatting and ruff are required
  checks. Upstream Spack added each of the last three releases within a day of tagging, eic-shell ships 1.1, and EDM4eic,
  EICrecon and the EIC simulation chain build on it.
criteria:
  eng.change-control:
    level: 1
    confidence: high
    rationale: >-
      58.5% of merged PRs have a non-author review, but only 74.7% of first-parent commits came from PRs;
      maintainers push release-note, version-bump and CI changes directly to `main`, below the 80% needed
      for level 2.
    evidence:
      - metrics:git.first_parent_pr_fraction_12m = 0.747
      - metrics:prs.reviewed_fraction_12m = 0.585
      - https://github.com/key4hep/EDM4hep/rules/11846862
      - https://github.com/key4hep/EDM4hep/commit/84b137b1a0e1b50ab49e33e577f12502c8800bc5
      - https://github.com/key4hep/EDM4hep/blob/2b569d9fb7085c28cd69b7d0cd129ee9bb178c90/.github/PULL_REQUEST_TEMPLATE#L1-L8
    gaps:
      - 19 of 75 first-parent commits in 12 months bypassed PRs (release notes, version bumps, CI and CMake config updates).
      - The rulesets require a PR but zero approving reviews, and there is no CODEOWNERS.
    actions:
      - action: Route release-note, version-bump and Key4hepConfig/CI template updates through PRs and remove maintainer bypass from the `main` ruleset.
        priority: medium
        effort: S
      - action: Set `required_approving_review_count` to 1 in the "Default branch (Key4hep)" ruleset.
        priority: medium
        effort: S
  eng.ci:
    level: 2
    confidence: high
    rationale: >-
      Every PR and push to `main` builds and runs ctest on four LCG stacks (GCC and Clang, podio main) and
      on Key4hep release and nightly stacks, as required status checks, with 80% of default-branch runs
      succeeding. Level 3 is missed on the 90% success rate and on a downstream check that failed on 8 of its
