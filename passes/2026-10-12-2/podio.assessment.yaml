schema_version: 1
project: podio
pass: "2026-10-12-2"
commit: a80a6a17e78998e488395b288553a78e7d14dd61
assessor: { agent: claude-code, model: claude-opus-5-5 }
summary: >-
  podio has no named maintainers, governance, code of conduct, citation metadata, or documented
  version scheme, its LICENSE file is not machine-detectable, all releases in 24 months were cut by
  one person, and 76% of default-branch CI runs succeed. CI builds and runs the Catch2 and I/O
  round-trip suites (including reading files from older podio versions) on GCC and Clang across
  LCG/Key4hep stacks on every PR, with pre-commit (clang-format, clang-tidy, cppcheck, pylint),
  sanitizer jobs, and downstream EDM4hep and EDM4eic builds as required checks. The latest release
  (1.8) is in upstream Spack and ships in eic-shell, where EDM4eic, EICrecon and JANA2 build on it.
criteria:
  eng.change-control:
    level: 2
    confidence: high
    rationale: >-
      95.5% of first-parent commits arrive through PRs and 67.5% of merged PRs have a review by someone
      other than the author, below the 90% needed for level 3. Branch protection requires status
      checks, but no required review, CODEOWNERS, or documented review expectations are visible.
    evidence:
      - metrics:git.first_parent_pr_fraction_12m = 0.955
      - metrics:prs.reviewed_fraction_12m = 0.675
      - metrics:repo.default_branch_protected = true
      - https://api.github.com/repos/AIDASoft/podio/branches/master
      - https://github.com/AIDASoft/podio/blob/a80a6a17e78998e488395b288553a78e7d14dd61/.github/CONTRIBUTING.md#L4-L22
    gaps:
      - Fewer than 90% of merged PRs have a review by someone other than the author.
      - No CODEOWNERS file or publicly visible required-review rule.
      - The PR template contains only the release-notes block, with no review expectations.
    actions:
      - action: Require one approving review in the `master` branch protection rule and add `.github/CODEOWNERS`.
        priority: medium
        effort: S
      - action: Add a review checklist (tests, docs, release notes) to `.github/PULL_REQUEST_TEMPLATE`.
        priority: low
        effort: S
  eng.ci:
    level: 1
    confidence: high
    rationale: >-
      Every PR and push runs ctest on 7 LCG stacks, 2 Ubuntu stacks, 4 Key4hep configurations and 6
      sanitizer builds, plus downstream EDM4hep and EDM4eic builds, as required checks. Only 76% of
      recent default-branch runs succeed, below the 80% needed for level 2; the failures come from
      the `dev3` nightly jobs.
    evidence:
      - https://github.com/AIDASoft/podio/blob/a80a6a17e78998e488395b288553a78e7d14dd61/.github/workflows/test.yml#L3-L60
      - https://github.com/AIDASoft/podio/blob/a80a6a17e78998e488395b288553a78e7d14dd61/.github/workflows/edm4eic.yml#L41-L74
      - https://github.com/AIDASoft/podio/blob/a80a6a17e78998e488395b288553a78e7d14dd61/.github/workflows/edm4hep.yaml#L65-L74
      - metrics:ci.default_branch_success_rate = 0.76
      - https://github.com/AIDASoft/podio/actions/runs/37442394859
      - https://github.com/AIDASoft/podio/issues/1038
    gaps:
      - Fewer than 80% of recent default-branch runs succeed; `dev3` nightly jobs (required checks) fail repeatedly.
      - macOS, named as a supported platform in the README, is not built in CI.
    actions:
      - action: Fix or mark `continue-on-error` the `dev3` matrix entries in `test.yml`, `ubuntu.yml` and `edm4hep.yaml` so `master` stays green (issue #1038).
        priority: high
        effort: S
