  governance and the path to maintainership are undocumented, and eic-shell and upstream Spack ship
  46.8.1 while upstream released 47.0.0 through 48.1.0 (2026-07-14 to 2026-10-09). All
  default-branch changes arrive through PRs with an approval enforced by policy-bot and a merge queue
  gated on required CI, which builds and tests GCC, Clang, Linux, macOS and GPU configurations, runs
  physics-performance regression checks, and builds EICrecon against ACTS in the eic nightly container.
  There were 61 releases in 24 months with generated notes, each with a Zenodo DOI and a PyPI wheel.
